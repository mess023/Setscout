# Setscout — docker compose / TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML.
# Replace the /mnt/tank/... host paths with your own datasets and set a password.
services:
  setscout:
    image: ghcr.io/mess023/setscout:latest
    container_name: setscout
    restart: unless-stopped
    user: "568:568"            # TrueNAS "apps" user (datasets with the Apps preset). Elsewhere: remove → image default node (1000)
    ports:
      - "3847:3847"
    environment:
      PORT: "3847"
      SETSCOUT_PASSWORD: "VERANDER-MIJ"          # required on a LAN: the browser asks for it (any username)
      HOME: /data/home                           # writable home for tools (adb, caches) when running as 568
      # ADB_VENDOR_KEYS: /data/adbkey            # only for the optional android service, see docker/android/README.md
    volumes:
      - /mnt/tank/apps/setscout:/data            # settings, API keys, indexes (read-write)
      - /mnt/tank/music:/music:ro                # your music collection (read-only)
      - /mnt/tank/djsets:/sets:ro                # the mixes to scan (read-only)
      - /mnt/tank/djsets/tracklists:/exports     # "save on server" exports (read-write)

  # --- Optional: neural fingerprinting (methods "NeuralFP (NAFP)" and "PeakNetFP") ---
  # Separate image (TensorFlow CPU, ~2–3 GB). Same /data and /music paths as setscout, so file paths match.
  # No ports: Setscout reaches it inside the app at http://setscout-nafp:8099. Code: CC BY-NC-SA 4.0 (non-commercial).
  setscout-nafp:
    image: ghcr.io/mess023/setscout-nafp:latest
    container_name: setscout-nafp
    restart: unless-stopped
    user: "568:568"
    environment:
      NAFP_DATA: /data/nafp                      # index per model (embeddings + files.json)
      NAFP_THREADS: "4"                          # CPU threads for TensorFlow (0 = all)
    volumes:
      - /mnt/tank/apps/setscout:/data
      - /mnt/tank/music:/music:ro

  # --- Optional: Android emulator for the method 'Google "Zoek een nummer"' (experimental) ---
  # Not built by CI and not buildable by TrueNAS from this YAML: build setscout-android:latest once in the
  # TrueNAS shell (docker/android/README.md, steps 1–3), then uncomment this block. Needs /dev/kvm.
  # android:
  #   image: setscout-android:latest
  #   pull_policy: never                         # local image, built in the shell
  #   container_name: android
  #   restart: unless-stopped
  #   devices:
  #     - /dev/kvm:/dev/kvm
  #   environment:
  #     MEMORY: "4096"
  #     CORES: "2"
  #   volumes:
  #     - /mnt/tank/apps/setscout-android:/data  # AVD incl. Google login survives restarts
  #   ports:
  #     - "5555:5555"   # ADB, for the scrcpy login from your PC; Setscout itself uses android:5555 inside the app
