<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setscout</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%233b82f6'/><circle cx='16' cy='16' r='4' fill='%2309090b'/></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b; --surface: #111113; --surface-2: #18181b; --surface-3: #1f1f23;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.16);
    --text: #fafafa; --text-2: rgba(255,255,255,0.62); --text-3: rgba(255,255,255,0.38);
    --accent: #3b82f6; --accent-soft: rgba(59,130,246,0.15);
    --green: #4ade80; --green-soft: rgba(74,222,128,0.14);
    --amber: #fbbf24; --amber-soft: rgba(251,191,36,0.14);
    --red: #f87171; --red-soft: rgba(248,113,113,0.14);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    --mono: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace;
    --r: 10px;
  }
  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: 52px 1fr; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  [title] { cursor: help; }
  button[title], .file[title], .dir[title] { cursor: pointer; }
  abbr { text-decoration: underline dotted var(--text-3); text-underline-offset: 3px; }

  /* ---- header ---- */
  header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -0.01em; font-size: 15px; }
  .logo .dot { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at center, var(--bg) 0 3px, var(--accent) 4px); box-shadow: 0 0 16px var(--accent-soft); }
  .logo span { color: var(--text-3); font-weight: 400; margin-left: 4px; }
  .health { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 11.5px; }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .pill.ok::before { background: var(--green); } .pill.bad::before { background: var(--red); }

  /* ---- layout ---- */
  main { display: grid; grid-template-columns: 330px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--border); background: var(--surface); display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
  section.work { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .panel-title .btn { text-transform: none; letter-spacing: 0; }
  .panel-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; }

  /* ---- browser ---- */
  .pathbar { display: flex; gap: 6px; padding: 0 12px 10px; }
  .pathbar input { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-family: var(--mono); font-size: 12px; outline: none; }
  .pathbar input:focus { border-color: var(--accent); }
  .ibtn { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-2); flex: none; }
  .ibtn:hover { color: var(--text); border-color: var(--border-strong); }
  .tree { overflow: auto; padding: 4px 8px 12px; }
  .dir, .file { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px; user-select: none; }
  .dir:hover, .file:hover { background: var(--surface-2); }
  .dir { color: var(--text-2); } .dir .name { color: var(--text); }
  .file .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .size { font-size: 11px; color: var(--text-3); font-family: var(--mono); flex: none; }
  .file .add { opacity: 0; width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; line-height: 1; flex: none; }
  .file:hover .add { opacity: 1; }
  .file.queued { opacity: 0.55; }
  .file.queued .add { background: var(--surface-3); color: var(--text-3); }
  .empty { padding: 20px 12px; color: var(--text-3); font-size: 13px; text-align: center; }
  svg.ico { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- queue ---- */
  .queue { border-bottom: 1px solid var(--border); background: var(--surface); }
  .queue-body { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 0 16px 14px; align-items: start; }
  .sets { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .set { display: grid; grid-template-columns: 24px 1fr auto auto; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--border); position: relative; overflow: hidden; }
  .set.active { border-color: var(--accent); }
  .set .num { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
  .set .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .set .sub { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .set .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); transition: width 0.4s; }
  .status { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .status.bezig { background: var(--accent-soft); color: #93c5fd; }
  .status.klaar { background: var(--green-soft); color: var(--green); }
  .status.fout { background: var(--red-soft); color: var(--red); }
  .status.gestopt { background: var(--amber-soft); color: var(--amber); }
  .set .rm { color: var(--text-3); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
  .set .rm:hover { color: var(--red); background: var(--red-soft); }
  .set .redo:hover { color: var(--accent); background: var(--accent-soft); }
  .set .rm:disabled { opacity: 0.3; cursor: default; }
  .controls { display: flex; flex-direction: column; gap: 10px; min-width: 220px; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--text-2); }
  .field input { width: 70px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; text-align: right; font-family: var(--mono); font-size: 12px; outline: none; }
  .field input:focus { border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 8px; font-weight: 550; font-size: 13px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #2f6fe0; }
  .btn.danger { color: var(--red); } .btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn-row { display: flex; gap: 8px; }

  /* ---- results ---- */
  .results { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .tabs { display: flex; gap: 2px; padding: 10px 16px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab { padding: 8px 14px; border-radius: 8px 8px 0 0; font-size: 13px; color: var(--text-2); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; border-bottom: 0; }
  .tab:hover { color: var(--text); background: var(--surface); }
  .tab.active { color: var(--text); background: var(--surface-2); border-color: var(--border); }
  .tab .cnt { font-family: var(--mono); font-size: 11px; color: var(--text-3); white-space: pre; }
  .result-body { overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar .meta { color: var(--text-3); font-size: 12.5px; margin-right: auto; }
  .toolbar .meta b { color: var(--text-2); font-weight: 500; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); padding: 10px 10px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  td { padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: rgba(255,255,255,0.015); }
  td.n { font-family: var(--mono); font-size: 12px; color: var(--text-3); width: 52px; text-align: right; padding-right: 10px; white-space: nowrap; }
  td.t { width: 92px; }
  td.act { width: 40px; text-align: center; }
  td.artist { width: 32%; }
  tr.weak td { opacity: 0.5; }
  tr.weak td input:focus { opacity: 1; }
  tr.weak td.n::after { content: ' 1×'; font-size: 10px; color: var(--amber); }
  td input { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; outline: none; }
  td input:hover { border-color: var(--border); }
  td input:focus { border-color: var(--accent); background: var(--surface-2); }
  td.t input { font-family: var(--mono); font-size: 12.5px; }
  td.t input.bad { border-color: var(--red); }
  td .album { display: block; font-size: 11px; color: var(--text-3); padding: 0 8px 4px; }
  td .del { color: var(--text-3); width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; }
  td .del:hover { color: var(--red); background: var(--red-soft); }
  .warn { font-size: 12px; color: var(--amber); }
  .log { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); font-family: var(--mono); font-size: 12px; max-height: 220px; overflow: auto; padding: 8px 12px; color: var(--text-2); }
  .log.live { flex: 1 1 0; max-height: none; min-height: 160px; } /* during a scan: fill the panel down to the bottom, scroll inside */
  .log div { display: grid; grid-template-columns: 70px 16px 1fr; gap: 10px; padding: 2px 0; }
  .log .ts { color: var(--text-3); }
  .log .ok { color: var(--green); } .log .same { color: var(--text-3); } .log .none { color: var(--text-3); } .log .err { color: var(--red); }
  .placeholder { height: 100%; display: grid; place-items: center; color: var(--text-3); text-align: center; padding: 40px; }
  .placeholder p { max-width: 380px; margin-top: 8px; font-size: 13px; }
  .placeholder h3 { color: var(--text-2); font-weight: 500; }
  .progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { border-color: var(--red); color: var(--red); }
  /* ---- methods / settings ---- */
  .mtag { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
  td.m { width: 1%; white-space: nowrap; padding: 0 8px; }
  .log .mtag { margin-left: 8px; }
  .hdr-right { display: flex; align-items: center; gap: 12px; }
  .settings { overflow: auto; min-height: 0; }
  .settings-body { max-width: 980px; padding: 6px 20px 40px; display: flex; flex-direction: column; gap: 6px; }
  .settings h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin: 18px 0 4px; display: flex; gap: 10px; align-items: baseline; }
  .settings h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; }
  .mlist { display: flex; flex-direction: column; gap: 6px; }
  .mcard { display: grid; grid-template-columns: 24px 22px 40px 1fr auto 32px; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--border); }
  .mcard.off { opacity: 0.6; } .mcard.off:hover { opacity: 0.85; }
  .mcard.dragging { opacity: 0.4; border-style: dashed; }
  .mcard.na { grid-template-columns: 1fr auto; opacity: 0.7; }
  .grip { color: var(--text-3); cursor: grab; width: 24px; height: 28px; border-radius: 6px; font-size: 13px; letter-spacing: -2px; }
  .grip:hover, .grip:focus-visible { color: var(--text); background: var(--surface-2); outline: none; }
  .pos { font-family: var(--mono); font-size: 11.5px; color: var(--accent); text-align: center; }
  .mname { min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mname b { font-weight: 550; }
  .st { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
  .st.ok { background: var(--green-soft); color: var(--green); }
  .st.key, .st.index { background: var(--amber-soft); color: var(--amber); }
  .st.tool { background: var(--red-soft); color: var(--red); }
  .switch { position: relative; width: 40px; height: 22px; display: inline-block; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border-strong); transition: .15s; }
  .switch i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-2); transition: .15s; }
  .switch input:checked + i { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + i::after { left: 20px; background: #fff; }
  .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mfields { grid-column: 3 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px 24px; padding: 6px 0 4px; }
  .mfields .field input.wide, .mfields .field select, .sfield input.wide { width: 190px; text-align: left; }
  .field select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font-size: 12px; outline: none; }
  .install { grid-column: 1 / -1; font-size: 12px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); white-space: pre-wrap; }
  .tipline { grid-column: 1 / -1; font-size: 12px; color: var(--text-3); }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
  .chip button { width: 20px; height: 20px; border-radius: 50%; color: var(--text-3); }
  .chip button:hover { color: var(--red); background: var(--red-soft); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
  .sfield { display: inline-flex; align-items: center; gap: 8px; }
  .sfield input { width: 70px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font-family: var(--mono); font-size: 12px; outline: none; }
  .sfield input:focus, .mfields input:focus { border-color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 999px; border: 2px solid var(--bg); } ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<header>
  <div class="logo"><i class="dot"></i>Setscout <span>track IDs uit DJ-sets</span></div>
  <div class="hdr-right">
    <div class="health" id="health"></div>
    <button class="btn sm" id="view-btn" title="Herkenningsmethodes aan/uit zetten, instellen en in volgorde zetten; collectie indexeren">Instellingen</button>
  </div>
</header>

<main>
  <aside>
    <div class="panel-title">Bestanden <span id="startdir-btn" class="btn sm" title="Terug naar de map waar Setscout is gestart">Startmap</span></div>
    <div class="pathbar">
      <button class="ibtn" id="up" title="Map omhoog"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      <input id="path" spellcheck="false" placeholder="Pad… (Enter)">
      <button class="ibtn" id="drives" title="Stations (schijven) tonen"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></button>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <section class="work">
    <div class="queue">
      <div class="panel-title">Wachtrij <span id="queue-count" style="font-weight:400;text-transform:none;letter-spacing:0"></span></div>
      <div class="queue-body">
        <div class="sets" id="sets"></div>
        <div class="controls">
          <label class="field"><abbr title="Afstand in seconden tussen twee herkenningsmomenten. Bepaalt hoe nauwkeurig de van/tot-tijden zijn: 30 s stap = maximaal 30 s afwijking. Kleiner = nauwkeuriger maar trager (3 s wachttijd per stap i.v.m. Shazam-limiet).">Stap (s)</abbr><input id="step" type="number" min="10" max="120" step="5" value="30"></label>
          <label class="field"><abbr title="Lengte van het audiofragment dat per stap naar Shazam gaat (fingerprint). 18 s is de standaard; langer herkent iets beter, korter is sneller.">Fragment (s)</abbr><input id="segment" type="number" min="5" max="30" step="1" value="18"></label>
          <div class="btn-row">
            <button class="btn primary" id="start" style="flex:1" title="Scan alle sets in de wachtrij achter elkaar">Scannen</button>
            <button class="btn danger" id="stop" title="Stop de lopende scan; wat al herkend is blijft staan" disabled>Stop</button>
          </div>
        </div>
      </div>
    </div>

    <div class="results">
      <div class="tabs" id="tabs"></div>
      <div class="result-body" id="result"></div>
    </div>
  </section>

  <section class="settings" id="settings" hidden>
    <div class="settings-body" id="settings-body"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
// ------------------------------------------------------------------ state
const LS_KEY = 'setscout.v1';
const state = loadState();
let es = null;            // active EventSource
let running = false;      // queue runner active
let browsePath = '';

function loadState() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && Array.isArray(s.sets)) return s; } catch {}
  return { sets: [], activeId: null, step: 30, segment: 18 };
}
function save() {
  const copy = { ...state, sets: state.sets.map(s => ({ ...s, log: (s.log || []).slice(-200) })) };
  localStorage.setItem(LS_KEY, JSON.stringify(copy));
}
// A set that was mid-scan when the page was closed/refreshed can't resume — reset it to the queue.
for (const s of state.sets) if (s.status === 'bezig') { s.status = 'wachtrij'; s.pct = 0; }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// ------------------------------------------------------------------ time helpers
function fmt(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function parseTime(str) {
  const m = /^(?:(\d{1,2}):)?([0-5]?\d):([0-5]\d)$/.exec(String(str).trim());
  if (!m) return null;
  return (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]);
}
const fmtSize = (b) => b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' kB';

// ------------------------------------------------------------------ toast
let toastTimer;
function toast(msg, err = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 3200);
}

// ------------------------------------------------------------------ health
fetch('/api/health').then(r => r.json()).then(h => {
  $('health').innerHTML =
    `<span class="pill ${h.ffmpeg && h.ffprobe ? 'ok' : 'bad'}" title="ffmpeg knipt de audiofragmenten; zonder ffmpeg kan er niet gescand worden">ffmpeg ${h.ffmpeg && h.ffprobe ? 'gevonden' : 'ontbreekt'}</span>` +
    `<span class="pill" id="chain-pill">keten…</span>`;

// ------------------------------------------------------------------ file browser
const ICON_DIR = '<svg class="ico" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const ICON_AUDIO = '<svg class="ico" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>';
const ICON_DRIVE = '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 12h.01"/></svg>';

async function browse(path) {
  const r = await fetch('/api/browse?path=' + encodeURIComponent(path || ''));
  const d = await r.json();
  if (d.error) return toast(d.error, true);
  browsePath = d.path; $('path').value = d.path;
  $('up').onclick = () => d.parent != null && browse(d.parent);
  $('up').disabled = d.parent == null;
  const queued = new Set(state.sets.map(s => s.path));
  const isDrives = !d.path;
  let html = '';
  for (const dir of d.dirs) html += `<div class="dir" data-path="${esc(dir.path)}">${isDrives ? ICON_DRIVE : ICON_DIR}<span class="name">${esc(dir.name)}</span></div>`;
  for (const f of d.files) html += `<div class="file ${queued.has(f.path) ? 'queued' : ''}" data-path="${esc(f.path)}" data-name="${esc(f.name)}" title="${queued.has(f.path) ? 'Staat al in de wachtrij' : 'Klik om toe te voegen aan de wachtrij'}">${ICON_AUDIO}<span class="name">${esc(f.name)}</span><span class="size">${fmtSize(f.size)}</span><span class="add">+</span></div>`;
  if (!html) html = '<div class="empty">Geen submappen of audiobestanden</div>';
  $('tree').innerHTML = html;
}
$('tree').addEventListener('click', (e) => {
  const dir = e.target.closest('.dir'); if (dir) return browse(dir.dataset.path);
  const f = e.target.closest('.file'); if (f) addSet(f.dataset.path, f.dataset.name);
});
$('path').addEventListener('keydown', (e) => { if (e.key === 'Enter') browse(e.target.value); });
$('drives').onclick = () => browse('drives');

// ------------------------------------------------------------------ queue
function addSet(path, name) {
  if (state.sets.some(s => s.path === path)) return toast('Staat al in de wachtrij');
  state.sets.push({ id: uid(), path, name, status: 'wachtrij', pct: 0, tracks: [], log: [], duration: null });
  if (!state.activeId) state.activeId = state.sets[state.sets.length - 1].id;
  save(); renderAll(); browse(browsePath);
}
function removeSet(id) {
  const s = state.sets.find(s => s.id === id);
  if (!s || s.status === 'bezig') return;
  if (s.tracks.length && !confirm(`"${s.name}" verwijderen inclusief ${s.tracks.length} gevonden tracks?`)) return;
  state.sets = state.sets.filter(s => s.id !== id);
  if (state.activeId === id) state.activeId = state.sets[0]?.id || null;
  save(); renderAll(); browse(browsePath);
}
function requeueSet(id) {
  const s = state.sets.find(s => s.id === id);
  if (!s || s.status === 'bezig') return;
  if (s.tracks.length && !confirm(`"${s.name}" opnieuw scannen? ${plural(s.tracks.length, 'huidige track wordt', 'huidige tracks worden')} vervangen (incl. bewerkingen).`)) return;
  s.status = 'wachtrij'; s.pct = 0; s.tracks = []; s.log = []; save(); renderAll();
}
const STATUS_LABEL = { wachtrij: 'In wachtrij', bezig: 'Bezig', klaar: 'Klaar', fout: 'Fout', gestopt: 'Gestopt' };

function renderQueue() {
  const el = $('sets');
  $('queue-count').textContent = state.sets.length ? `${state.sets.length} set${state.sets.length > 1 ? 's' : ''}` : '';
  if (!state.sets.length) { el.innerHTML = '<div class="empty" style="text-align:left;padding:10px 4px">Kies links een bestand om toe te voegen.</div>'; }
  else el.innerHTML = state.sets.map((s, i) => `
    <div class="set ${s.id === state.activeId ? 'active' : ''}" data-id="${s.id}">
      <span class="num">${i + 1}</span>
      <div style="min-width:0"><div class="title" title="${esc(s.path)}">${esc(s.name)}</div><div class="sub">${esc(s.path)}</div></div>
      <span class="status ${s.status}">${STATUS_LABEL[s.status]}${s.status === 'bezig' ? ` ${s.pct}%` : s.status !== 'wachtrij' ? ` · ${plural(s.tracks.length, 'track', 'tracks')}` : ''}</span>
      <span style="display:flex;gap:2px">${s.status !== 'wachtrij' && s.status !== 'bezig' ? `<button class="rm redo" title="Opnieuw scannen (huidige tracks worden vervangen)">↻</button>` : ''}<button class="rm" title="Uit wachtrij verwijderen" ${s.status === 'bezig' ? 'disabled' : ''}>✕</button></span>
      <i class="bar" style="width:${s.status === 'bezig' ? s.pct : 0}%"></i>
    </div>`).join('');
  const pending = state.sets.filter(s => s.status === 'wachtrij').length;
  $('start').disabled = running || !pending;
  $('start').textContent = running ? 'Bezig…' : pending ? `Scannen (${pending})` : 'Scannen';
  $('stop').disabled = !running;
}
$('sets').addEventListener('click', (e) => {
  const row = e.target.closest('.set'); if (!row) return;
  if (e.target.closest('.redo')) return requeueSet(row.dataset.id);
  if (e.target.closest('.rm')) return removeSet(row.dataset.id);
  state.activeId = row.dataset.id; save(); renderAll();
});
$('step').value = state.step; $('segment').value = state.segment;
$('step').onchange = (e) => { state.step = Math.min(120, Math.max(10, +e.target.value || 30)); e.target.value = state.step; save(); };
$('segment').onchange = (e) => { state.segment = Math.min(30, Math.max(5, +e.target.value || 18)); e.target.value = state.segment; save(); };

// ------------------------------------------------------------------ scanning
$('start').onclick = () => { if (!running) { running = true; renderQueue(); runNext(); } };
$('stop').onclick = async () => {
  running = false;
  await fetch('/api/scan/stop');
  toast('Stoppen na het huidige fragment…');
};

function runNext() {
  const s = state.sets.find(s => s.status === 'wachtrij');
  if (!s || !running) { running = false; renderQueue(); if (!s) toast('Wachtrij afgerond'); return; }
  s.status = 'bezig'; s.pct = 0; s.log = []; s.tracks = []; state.activeId = s.id;
  save(); renderAll();
  const url = `/api/scan?file=${encodeURIComponent(s.path)}&step=${state.step}&segment=${state.segment}`;
  es = new EventSource(url);
  es.addEventListener('start', (e) => { const d = JSON.parse(e.data); s.duration = d.duration; s.total = d.total; s.step = d.step; renderResult(); });
  es.addEventListener('segment', (e) => {
    const d = JSON.parse(e.data);
    s.pct = d.pct; s.log.push(d);
    renderQueue(); appendLog(s, d);
  });
  es.addEventListener('note', (e) => { const d = JSON.parse(e.data); const l = { timestamp: '', status: 'note', message: d.message }; s.log.push(l); appendLog(s, { ...l, pct: s.pct }); });
  es.addEventListener('done', (e) => {
    const d = JSON.parse(e.data);
    for (const r of d.reference || []) s.log.push({ timestamp: '', status: r.error ? 'error' : 'note', message: r.error ? `${r.method}: ${r.error}` : `${r.method}: ${plural(r.filled, 'fragment', 'fragmenten')} aangevuld uit ${plural(r.tracks, 'track', 'tracks')}` });
    s.tracks = d.tracks.map(normalize); s.duration = d.duration;
    s.status = d.aborted ? 'gestopt' : 'klaar'; s.pct = 100;
    es.close(); es = null; save(); renderAll();
    if (d.aborted) { running = false; renderQueue(); toast('Scan gestopt — deelresultaat bewaard'); return; }
    runNext();
  });
  es.addEventListener('error', (e) => {
    // Custom `error` event from server (has data) or connection failure (no data).
    let msg = 'Verbinding met de server verbroken';
    try { if (e.data) msg = JSON.parse(e.data).message; } catch {}
    if (es) { es.close(); es = null; }
    s.status = 'fout'; s.error = msg; running = false;
    save(); renderAll(); toast(msg, true);
  });
}
const normalize = (t) => ({ id: uid(), start_sec: t.start_sec, end_sec: t.end_sec, artist: t.artist || '', title: t.title || '', album: t.album || '', year: t.year || '', hits: t.hits ?? null,
  method: t.method || '', bpm: t.bpm || '', key: t.key || '', isrc: t.isrc || '', mbid: t.mbid || '', label: t.label || '', exact: Boolean(t.exact), spread: t.spread ?? null, agree: t.agree || '' });
// exact start where fewer than half of the offset estimates agree → worth a check
const doubtful = (t) => { if (!t.exact || !t.agree) return false; const [a, n] = t.agree.split('/').map(Number); return a * 2 < n; };

// ------------------------------------------------------------------ results
function renderTabs() {
  $('tabs').innerHTML = state.sets.map(s =>
    `<button class="tab ${s.id === state.activeId ? 'active' : ''}" data-id="${s.id}" title="${esc(s.path)}">${esc(s.name)}<span class="cnt">${s.status === 'wachtrij' ? '' : ' · ' + s.tracks.length}</span></button>`
  ).join('');
}
$('tabs').addEventListener('click', (e) => { const t = e.target.closest('.tab'); if (t) { state.activeId = t.dataset.id; save(); renderAll(); } });

const STATUS_ICON = { match: ['✓', 'ok'], same: ['↩', 'same'], none: ['?', 'none'], skip: ['–', 'none'], error: ['!', 'err'], note: ['i', 'same'] };
function logLine(d) {
  const [ic, cls] = STATUS_ICON[d.status] || ['?', 'none'];
  const txt = d.match ? `${d.match.artist} — ${d.match.title}` : d.status === 'error' || d.status === 'note' ? d.message : d.status === 'skip' ? 'fragment overgeslagen' : 'niet herkend';
  return `<div><span class="ts">${d.timestamp}</span><span class="${cls}">${ic}</span><span class="${cls}">${esc(txt)}${d.match?.method ? `<span class="mtag">${esc(d.match.method)}</span>` : ''}</span></div>`;
}
function appendLog(s, d) {
  if (s.id !== state.activeId) return;
  const log = $('scanlog'); if (!log) return renderResult();
  log.insertAdjacentHTML('beforeend', logLine(d)); log.scrollTop = log.scrollHeight;
  const p = $('scanpct'); if (p) p.style.width = d.pct + '%';
  const m = $('scanmeta'); if (m) m.innerHTML = scanMeta(s);
  const pill = $('scanpill'); if (pill) pill.textContent = `Bezig ${d.pct}%`;
}
function scanMeta(s) {
  const found = s.log.filter(l => l.status === 'match').length;
  return `Fragment <b>${s.log.length}/${s.total || '?'}</b> · <b>${found}</b> ${found === 1 ? 'wissel' : 'wissels'} gevonden · duur set <b>${s.duration ? fmt(s.duration) : '…'}</b>`;
}

function extraLine(t) {
  const bits = [t.album, t.year, t.label].filter(Boolean).map(esc).concat([
    t.bpm && `<abbr title="Tempo in beats per minute (Essentia)">${esc(t.bpm)} BPM</abbr>`,
    t.key && `<abbr title="Toonsoort (Essentia)">${esc(t.key)}</abbr>`,
    t.isrc && `<abbr title="ISRC: internationale code van deze opname (MusicBrainz)">${esc(t.isrc)}</abbr>`].filter(Boolean));
  return bits.length ? `<span class="album">${bits.join(' · ')}</span>` : '';
}

function renderResult() {
  const s = state.sets.find(s => s.id === state.activeId);
  const el = $('result');
  if (!s) { el.innerHTML = `<div class="placeholder"><div><h3>Nog geen set geselecteerd</h3><p>Blader links naar een map met DJ-sets, voeg er een of meer toe aan de wachtrij en klik op Scannen. Hier verschijnt daarna per set de lijst met gevonden track IDs om na te kijken, te bewerken en op te slaan.</p></div></div>`; return; }
  if (s.status === 'wachtrij') { el.innerHTML = `<div class="placeholder"><div><h3>${esc(s.name)}</h3><p>Staat in de wachtrij. Klik op Scannen om te beginnen.</p></div></div>`; return; }
  if (s.status === 'bezig') {
    el.innerHTML = `
      <div class="toolbar"><span class="meta" id="scanmeta">${scanMeta(s)}</span><span class="status bezig" id="scanpill">Bezig ${s.pct}%</span></div>
      <div class="progress"><i id="scanpct" style="width:${s.pct}%"></i></div>
      <div class="log live" id="scanlog">${s.log.map(logLine).join('')}</div>`;
    const log = $('scanlog'); log.scrollTop = log.scrollHeight;
    return;
  }
  const rows = s.tracks.map((t, i) => `
    <tr data-id="${t.id}" class="${t.hits === 1 ? 'weak' : ''}" ${t.hits === 1 ? 'title="Slechts 1 keer herkend — mogelijk een misser van Shazam tijdens een overgang. Controleer of verwijder."' : ''}>
      <td class="n">${i + 1}</td>
      <td class="t"><input data-f="start_sec" value="${fmt(t.start_sec)}" title="${t.exact ? `Op de seconde: berekend uit de offset (positie binnen het origineel). ${t.agree || ''} schattingen eens binnen ±2 s; totale spreiding ${t.spread} s (herhaalde maten/loops geven uitschieters)${doubtful(t) ? ' — minder dan de helft eens: controleer' : ''}` : `Eerste herkenning (±${s.step || state.step} s): geen bruikbare offset${t.agree ? ' (DJ startte de track waarschijnlijk midden in het nummer)' : ''}`}"${doubtful(t) ? ' style="color:var(--amber)"' : ''}></td>
      <td class="t"><input data-f="end_sec" value="${fmt(t.end_sec)}" title="Overgang naar de volgende track (±${s.step || state.step} s); vrij te bewerken"></td>
      <td class="artist"><input data-f="artist" value="${esc(t.artist)}" placeholder="Artiest"></td>
      <td><input data-f="title" value="${esc(t.title)}" placeholder="Titel">${extraLine(t)}</td>
      <td class="m">${t.method ? `<span class="mtag" title="Gevonden door ${esc(t.method)}">${esc(t.method)}</span>` : ''}</td>
      <td class="act"><button class="del" title="Track verwijderen">✕</button></td>
    </tr>`).join('');
  const gaps = s.tracks.filter((t, i) => i > 0 && t.start_sec - s.tracks[i - 1].end_sec > 120).length;
  el.innerHTML = `
    <div class="toolbar">
      <span class="meta"><b>${s.tracks.length}</b> ${s.tracks.length === 1 ? 'track' : 'tracks'} · duur <b>${fmt(s.duration)}</b> · stap <b>${s.step || state.step} s</b>${s.status === 'gestopt' ? ' · <span class="warn">scan gestopt, deelresultaat</span>' : ''}${s.status === 'fout' ? ` · <span class="warn">fout: ${esc(s.error)}</span>` : ''}</span>
      <button class="btn sm" id="add-track" title="Lege regel toevoegen; vul van/tot en artiest – titel zelf in">+ Track toevoegen</button>
      <button class="btn sm" id="sort-tracks" title="Sorteer op begintijd">Sorteren</button>
      ${s.tracks.some(t => t.hits === 1) ? `<button class="btn sm" id="drop-weak" title="Verwijder alle regels die maar 1 keer herkend zijn (gedimd weergegeven); meestal missers tijdens overgangen">1×-missers weg (${s.tracks.filter(t => t.hits === 1).length})</button>` : ''}
      <span style="width:1px;height:22px;background:var(--border)"></span>
      <button class="btn sm" data-x="txt" title="Platte tekst: Artiest - Titel  van–tot">Opslaan .txt</button>
      <button class="btn sm" data-x="csv" title="Komma-gescheiden, opent in Excel/Sheets">Opslaan .csv</button>
      <button class="btn sm" data-x="json" title="Gestructureerd, inclusief seconden en album/jaar">Opslaan .json</button>
    </div>
    ${gaps ? `<div class="warn">${gaps} gat${gaps > 1 ? 'en' : ''} van meer dan 2 minuten zonder herkende track — mogelijk ontbreken daar tracks.</div>` : ''}
    ${s.tracks.length ? `<table><thead><tr><th>#</th><th title="Begin van de track in de set, op de seconde: berekend uit de offset (positie binnen het originele nummer) van elke herkenning. Zonder offset: eerste herkenning. Oranje = minder dan de helft van de schattingen is het eens: controleer.">Van</th><th title="Begin van de volgende track (op de seconde als die een offset heeft). Bij een lang gat zonder herkenning: laatste herkenning + stap. Laatste track: laatste herkenning + fragmentlengte.">Tot</th><th>Artiest</th><th>Titel</th><th title="Welke herkenningsmethode de track (als eerste) vond">Methode</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty">Geen tracks herkend. Voeg handmatig toe of scan opnieuw met een kleinere stap.</div>`}
    ${s.log.length ? `<details><summary style="color:var(--text-3);font-size:12px;cursor:pointer">Scanlog (${plural(s.log.length, 'fragment', 'fragmenten')})</summary><div class="log" style="margin-top:8px">${s.log.map(logLine).join('')}</div></details>` : ''}`;

  el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => exportSet(s, b.dataset.x));
  $('add-track').onclick = () => {
    const last = s.tracks[s.tracks.length - 1];
    s.tracks.push({ id: uid(), start_sec: last ? last.end_sec : 0, end_sec: last ? last.end_sec + 60 : 60, artist: '', title: '', album: '', year: '' });
    save(); renderAll();
    const inputs = el.querySelectorAll('tbody tr:last-child input'); inputs[2]?.focus();
  };
  $('sort-tracks').onclick = () => { s.tracks.sort((a, b) => a.start_sec - b.start_sec); save(); renderAll(); };
  const dw = $('drop-weak'); if (dw) dw.onclick = () => {
    const n = s.tracks.filter(t => t.hits === 1).length;
    s.tracks = s.tracks.filter(t => t.hits !== 1).sort((a, b) => a.start_sec - b.start_sec);
    // close the hole a removed stray leaves: previous track ends halfway to the next one (same rule as the scanner)
    const step = s.step || state.step;
    s.tracks.forEach((t, i) => { const nx = s.tracks[i + 1]; if (nx && nx.start_sec > t.end_sec && nx.start_sec - t.end_sec <= 3 * step) t.end_sec = nx.exact ? nx.start_sec : Math.round((t.end_sec + nx.start_sec) / 2); });
    save(); renderAll(); toast(plural(n, 'losse detectie verwijderd', 'losse detecties verwijderd'));
  };
}
$('result').addEventListener('change', (e) => {
  const inp = e.target; if (!inp.matches('td input')) return;
  const s = state.sets.find(s => s.id === state.activeId);
  const t = s.tracks.find(t => t.id === inp.closest('tr').dataset.id);
  const f = inp.dataset.f;
  if (f === 'start_sec' || f === 'end_sec') {
    const sec = parseTime(inp.value);
    if (sec == null) { inp.classList.add('bad'); return; }
    inp.classList.remove('bad'); t[f] = sec; inp.value = fmt(sec);
  } else t[f] = inp.value.trim();
  save(); renderTabs();
});
$('result').addEventListener('click', (e) => {
  const del = e.target.closest('.del'); if (!del) return;
  const s = state.sets.find(s => s.id === state.activeId);
  s.tracks = s.tracks.filter(t => t.id !== del.closest('tr').dataset.id);
  save(); renderAll();
});

// ------------------------------------------------------------------ export
function exportSet(s, kind) {
  const base = s.name.replace(/\.[^.]+$/, '');
  const tracks = [...s.tracks].sort((a, b) => a.start_sec - b.start_sec);
  let body, mime;
  if (kind === 'txt') {
    body = tracks.map((t, i) => `${String(i + 1).padStart(2, '0')}. ${fmt(t.start_sec)} - ${fmt(t.end_sec)}  ${t.artist} - ${t.title}${t.method ? `  [${t.method}]` : ''}`).join('\n') + '\n';
    mime = 'text/plain';
  } else if (kind === 'csv') {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    body = ['nr,van,tot,van_sec,tot_sec,artiest,titel,album,jaar,methode,bpm,key,isrc']
      .concat(tracks.map((t, i) => [i + 1, fmt(t.start_sec), fmt(t.end_sec), t.start_sec, t.end_sec, t.artist, t.title, t.album, t.year, t.method, t.bpm, t.key, t.isrc].map(q).join(',')))
      .join('\r\n') + '\r\n';
    body = '﻿' + body; // BOM so Excel reads UTF-8 (accented artist names)
    mime = 'text/csv';
  } else {
    body = JSON.stringify({
      source: s.name, path: s.path, duration: s.duration, step: s.step || state.step, exported: new Date().toISOString(),
      tracks: tracks.map((t, i) => ({ nr: i + 1, start: fmt(t.start_sec), end: fmt(t.end_sec), start_sec: t.start_sec, end_sec: t.end_sec, artist: t.artist, title: t.title, album: t.album, year: t.year, detections: t.hits, start_exact: t.exact, start_agree: t.agree || null, start_spread_sec: t.spread, method: t.method || null, bpm: t.bpm || null, key: t.key || null, isrc: t.isrc || null, mbid: t.mbid || null, label: t.label || null })),
    }, null, 2);
    mime = 'application/json';
  }
  saveFile(`${base}_tracklist.${kind}`, body, mime, kind);
}

/** Native "Opslaan als"-dialoog (File System Access API, Chrome/Edge); anders gewone download naar Downloads. */
async function saveFile(name, body, mime, ext) {
  if (cfg?.export.target === 'server') {
    const r = await fetch('/api/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, body }) });
    const d = await r.json();
    return d.error ? toast(d.error, true) : toast(`Opgeslagen op de server: ${d.path}`);
  }
  if (window.showSaveFilePicker) {
    try {
      const handle = await showSaveFilePicker({ suggestedName: name, id: 'setscout-export', types: [{ description: ext.toUpperCase(), accept: { [mime]: ['.' + ext] } }] });
      const w = await handle.createWritable(); await w.write(body); await w.close();
      return toast(`Opgeslagen: ${handle.name}`);
    } catch (e) {
      if (e.name === 'AbortError') return; // gebruiker annuleerde
      console.warn('showSaveFilePicker mislukt, val terug op download', e);
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: mime + ';charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`Opgeslagen als ${name} (map Downloads)`);
}

// ------------------------------------------------------------------ settings (methods, keten, collectie, export)
let cfg = null;            // /api/methods payload
const openCards = new Set();
const ST_LABEL = { ok: 'Klaar', key: 'Sleutel ontbreekt', tool: 'Niet geïnstalleerd', index: 'Index leeg', na: 'Niet mogelijk' };
const GROUPS = [
  ['chain', 'Herkenningsketen', 'Per fragment probeert Setscout de actieve methodes van boven naar beneden; de eerste die een track vindt, wint. Ook tracklists (Referentie) kunnen overal staan: bovenaan wordt de tracklist eerst overgenomen en gaan alleen "ID"-tracks en stukken zonder cue naar de methodes eronder; onderaan vult hij alleen wat de rest niet vond. Sleep aan ⋮⋮ (of pijltjestoetsen) om de volgorde te wijzigen.'],
  ['enrich', 'Verrijking', 'Herkennen zelf niets: voegen metadata of analyse toe aan elke gevonden track.'],
  ['none', 'Niet mogelijk (nu)', 'Onderzocht maar niet te bouwen zonder eigen werk of hardware; reden in de tooltip.'],
];

async function loadMethods() {
  try { cfg = await (await fetch('/api/methods')).json(); } catch { return; }
  renderChainPill();
  if (state.view === 'settings') renderSettings();
}
async function saveSettings(patch, rerender = true) {
  const r = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
  const d = await r.json();
  if (d.error) { toast(d.error, true); return false; }
  cfg = d; renderChainPill();
  if (rerender) renderSettings(); else updateStatusPills();
  toast('Opgeslagen');
  return true;
}
const inChain = (m) => m.group === 'recognize' || m.group === 'reference';
const chain = () => cfg ? cfg.methods.filter(m => inChain(m) && m.values.enabled) : [];
function renderChainPill() {
  const p = $('chain-pill'); if (!p || !cfg) return;
  const on = chain(), ready = on.filter(m => m.state === 'ok');
  p.className = 'pill ' + (ready.length ? 'ok' : 'bad');
  p.textContent = `keten: ${ready.map(m => m.label).join(' → ') || 'leeg'}`;
  p.title = 'Herkenningsketen (pipeline): volgorde waarin elk fragment wordt geprobeerd. ' +
    (on.length > ready.length ? `Niet klaar en dus overgeslagen: ${on.filter(m => m.state !== 'ok').map(m => `${m.label} (${ST_LABEL[m.state]})`).join(', ')}. ` : '') + 'Wijzigen onder Instellingen.';
}

function fieldHtml(m, f) {
  const v = m.values[f.key] ?? '';
  const tip = f.tip ? ` title="${esc(f.tip)}"` : '';
  const lab = `<abbr${tip}>${esc(f.label)}</abbr>`;
  if (f.type === 'select') return `<label class="field">${lab}<select data-key="${f.key}">${f.options.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  if (f.type === 'secret') {
    const set = m.secrets[f.key];
    return `<label class="field">${lab}<span style="display:flex;gap:6px"><input class="wide" type="password" autocomplete="off" data-key="${f.key}" placeholder="${set ? 'opgeslagen ••••' : 'nog niet ingesteld'}" title="${set ? 'Leeg laten = opgeslagen sleutel behouden; typ een nieuwe om te vervangen' : 'Plakken en Tab/Enter om op te slaan'}">${set ? `<button class="btn sm" data-clear="${f.key}" title="Opgeslagen sleutel verwijderen">Wis</button>` : ''}</span></label>`;
  }
  return `<label class="field">${lab}<input class="${f.type === 'number' ? '' : 'wide'}" type="${f.type === 'number' ? 'number' : 'text'}" step="any" spellcheck="false" data-key="${f.key}" value="${esc(v)}"></label>`;
}

function cardHtml(m, pos) {
  if (m.group === 'none') return `<div class="mcard na" data-id="${m.id}"><div class="mname"><b title="${esc(m.tip)}">${esc(m.label)}</b></div><span class="st" title="${esc(m.tip)}">${esc(m.msg)}</span></div>`;
  const on = m.values.enabled, open = openCards.has(m.id);
  return `<div class="mcard ${on ? '' : 'off'}" data-id="${m.id}">
    <button class="grip" aria-label="Verplaats ${esc(m.label)}" title="Sleep om de volgorde te wijzigen (of focus en ↑/↓)">⋮⋮</button>
    <span class="pos" title="${on ? 'Positie in de keten' : 'Uit'}">${on && inChain(m) ? pos : ''}</span>
    <label class="switch" title="${on ? 'Aan — klik om uit te zetten' : 'Uit — klik om aan te zetten'}"><input type="checkbox" data-act="toggle" ${on ? 'checked' : ''} aria-label="${esc(m.label)} aan/uit"><i></i></label>
    <div class="mname"><b title="${esc(m.tip)}">${esc(m.label)}</b><span class="mtag" title="${m.local ? 'Fingerprint van je eigen muziekbestanden (index onder Collectie)' : m.kind === 'Cloud' ? 'Online dienst met eigen database; het fragment wordt geüpload' : esc(m.kind)}">${esc(m.kind)}</span></div>
    <span class="st ${m.state}" data-st="${m.id}" title="${esc(m.install || m.msg)}">${esc(m.msg)}</span>
    <button class="ibtn" data-act="expand" title="${open ? 'Instellingen inklappen' : 'Instellingen tonen'}" aria-expanded="${open}" ${!m.fields.length && !m.install ? 'disabled style="opacity:.3"' : ''}>${open ? '▴' : '▾'}</button>
    ${open ? `<div class="mfields"><div class="tipline">${esc(m.tip)}</div>${m.fields.map(f => fieldHtml(m, f)).join('')}${m.install ? `<div class="install" title="${m.state === 'key' ? 'Waar je de sleutel haalt' : 'Exacte installatie-instructie'}">${m.state === 'key' ? 'Sleutel' : 'Installeren'}: ${esc(m.install)}</div>` : ''}</div>` : ''}
  </div>`;
}

function renderSettings() {
  const el = $('settings-body');
  if (!cfg) { el.innerHTML = '<div class="empty">Instellingen laden…</div>'; return; }
  let html = '';
  for (const [g, title, tip] of GROUPS) {
    const list = cfg.methods.filter(m => g === 'chain' ? inChain(m) : m.group === g);
    let pos = 0;
    html += `<h2><abbr title="${esc(tip)}">${title}</abbr>${g === 'chain' ? `<small>${chain().length} actief</small>` : ''}</h2>
      <div class="mlist" data-group="${g}">${list.map(m => cardHtml(m, m.values.enabled ? ++pos : 0)).join('')}</div>`;
  }
  const c = cfg.collection;
  const locals = cfg.methods.filter(m => m.local);
  html += `<h2><abbr title="Methodes met het label 'Eigen collectie' herkennen alleen tracks die in jouw muziekmappen staan. Daarvoor bouwt Setscout eerst een index (fingerprint-database) in de map data/index.">Collectie</abbr><small>${plural(c.roots.length, 'map', 'mappen')}</small></h2>
    <div class="box">
      <div class="chips">${c.roots.map(r => `<span class="chip">${esc(r)}<button data-rmroot="${esc(r)}" title="Map uit de collectie halen (index blijft staan)">✕</button></span>`).join('') || '<span class="row">Nog geen muziekmappen gekozen.</span>'}</div>
      <div class="row">
        <button class="btn sm" id="add-root" title="Voeg de map toe die nu links in de bestandsbrowser open staat">+ Huidige map toevoegen</button>
        <span class="sfield"><abbr title="Aantal CPU-threads dat de fingerprint-tools tegelijk mogen gebruiken bij het indexeren (Olaf --threads, audfprint --ncores). Hoger = sneller, maar zwaarder voor de NAS.">Threads</abbr><input type="number" min="1" max="64" id="threads" value="${c.threads}"></span>
        <span style="flex:1"></span>
        <button class="btn sm primary" id="index-start" title="Nieuwe en gewijzigde bestanden toevoegen aan de index van elke actieve 'Eigen collectie'-methode">Index bijwerken</button>
        <button class="btn sm danger" id="index-stop" title="Indexeren stoppen; wat al geïndexeerd is blijft" ${indexEs ? '' : 'disabled'}>Stop</button>
      </div>
      <div class="row">${locals.map(m => `<span class="st ${m.state}" title="${esc(m.install || m.msg)}">${esc(m.label)}: ${esc(m.msg)}</span>`).join('')}</div>
      <div class="progress" id="index-bar" ${indexEs ? '' : 'hidden'}><i style="width:0%"></i></div>
      <div class="log" id="index-log" ${indexLog.length ? '' : 'hidden'}>${indexLog.join('')}</div>
    </div>`;
  const ex = cfg.export;
  html += `<h2><abbr title="Waar de knoppen Opslaan .txt/.csv/.json het bestand neerzetten.">Export</abbr></h2>
    <div class="box">
      <div class="row">
        <label class="sfield"><input type="radio" name="ext" value="browser" ${ex.target !== 'server' ? 'checked' : ''} style="width:auto"> <abbr title="Opslaan-dialoog van de browser. Werkt alleen via localhost of HTTPS (secure context); anders gewone download naar de map Downloads.">In de browser</abbr></label>
        <label class="sfield"><input type="radio" name="ext" value="server" ${ex.target === 'server' ? 'checked' : ''} style="width:auto"> <abbr title="Setscout schrijft het bestand op de server/NAS zelf. Handig in Docker/TrueNAS via http://ip:poort.">Op de server</abbr></label>
      </div>
      <div class="row"><span class="sfield"><abbr title="Leeg = standaardmap. Moet binnen de toegestane mappen liggen.">Map</abbr><input class="wide" id="export-dir" spellcheck="false" placeholder="${esc(cfg.exportDefault)}" value="${esc(ex.dir)}" style="width:320px;text-align:left"></span>
      <button class="btn sm" id="export-here" title="Gebruik de map die links in de bestandsbrowser open staat">Huidige map</button></div>
      ${!window.isSecureContext && ex.target !== 'server' ? '<div class="warn">Deze pagina is niet via HTTPS/localhost geopend: de browser-dialoog werkt niet, exports gaan naar Downloads. Kies "Op de server" om op de NAS op te slaan.</div>' : ''}
    </div>`;
  // full re-render replaces the inputs → put focus back where the user is now (e.g. after Tab)
  const a = document.activeElement, fKey = a?.dataset?.key, fCard = a?.closest?.('.mcard')?.dataset.id, fGrip = a?.classList?.contains('grip'), fId = a?.id;
  el.innerHTML = html;
  const back = fCard && (fKey || fGrip) ? el.querySelector(`.mcard[data-id="${fCard}"] ${fKey ? `[data-key="${fKey}"]` : '.grip'}`) : fId ? $(fId) : null;
  back?.focus();
}
function updateStatusPills() {
  for (const m of cfg.methods) { const p = document.querySelector(`[data-st="${m.id}"]`); if (p) { p.className = `st ${m.state}`; p.textContent = m.msg; p.title = m.install || m.msg; } }
  const th = $('threads'); if (th) th.value = cfg.collection.threads; // server clamps 1–64
}

const sb = $('settings-body');
const cardId = (e) => e.target.closest('.mcard')?.dataset.id;
const methodPatch = (id, vals) => ({ methods: { [id]: vals } });
sb.addEventListener('change', (e) => {
  const t = e.target, id = cardId(e);
  if (t.dataset.act === 'toggle') return saveSettings(methodPatch(id, { enabled: t.checked }));
  if (t.dataset.key && id) {
    const isSecret = t.type === 'password';
    if (isSecret && !t.value) return;
    return saveSettings(methodPatch(id, { [t.dataset.key]: t.value }), isSecret);
  }
  if (t.id === 'threads') return saveSettings({ collection: { threads: t.value } }, false);
  if (t.name === 'ext') return saveSettings({ export: { target: t.value } });
  if (t.id === 'export-dir') return saveSettings({ export: { dir: t.value.trim() } });
});
sb.addEventListener('click', (e) => {
  const t = e.target, id = cardId(e);
  if (t.closest('[data-act="expand"]')) { openCards.has(id) ? openCards.delete(id) : openCards.add(id); return renderSettings(); }
  if (t.dataset.clear) return saveSettings(methodPatch(id, { [t.dataset.clear]: null }));
  if (t.dataset.rmroot) return saveSettings({ collection: { roots: cfg.collection.roots.filter(r => r !== t.dataset.rmroot) } });
  if (t.id === 'add-root') {
    if (!browsePath) return toast('Open links eerst een map in de bestandsbrowser', true);
    return saveSettings({ collection: { roots: [...cfg.collection.roots, browsePath] } });
  }
  if (t.id === 'export-here') {
    if (!browsePath) return toast('Open links eerst een map in de bestandsbrowser', true);
    return saveSettings({ export: { dir: browsePath, target: 'server' } });
  }
  if (t.id === 'index-start') return startIndex();
  if (t.id === 'index-stop') return fetch('/api/index/stop');
});

// drag & drop ordering (within one group), plus ↑/↓ on the focused grip
let dragEl = null;
let orderTimer;
const saveOrder = () => saveSettings({ order: [...sb.querySelectorAll('.mcard')].map(c => c.dataset.id) });
sb.addEventListener('mousedown', (e) => { const c = e.target.closest('.grip')?.closest('.mcard'); if (c) c.draggable = true; });
sb.addEventListener('dragstart', (e) => { dragEl = e.target.closest('.mcard'); dragEl?.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
sb.addEventListener('dragover', (e) => {
  if (!dragEl) return;
  const over = e.target.closest('.mcard'); e.preventDefault();
  if (!over || over === dragEl || over.parentNode !== dragEl.parentNode) return;
  const r = over.getBoundingClientRect();
  over.parentNode.insertBefore(dragEl, e.clientY < r.top + r.height / 2 ? over : over.nextSibling);
});
sb.addEventListener('drop', (e) => e.preventDefault());
sb.addEventListener('dragend', () => { if (!dragEl) return; dragEl.classList.remove('dragging'); dragEl.draggable = false; dragEl = null; saveOrder(); });
sb.addEventListener('keydown', (e) => {
  const g = e.target.closest('.grip'); if (!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const c = g.closest('.mcard'), sib = e.key === 'ArrowUp' ? c.previousElementSibling : c.nextElementSibling;
  if (!sib) return;
  c.parentNode.insertBefore(c, e.key === 'ArrowUp' ? sib : sib.nextSibling);
  g.focus(); // moving the node drops focus; keep it so repeated ↑/↓ keeps working
  clearTimeout(orderTimer); orderTimer = setTimeout(saveOrder, 500); // one save per burst of presses: a re-render from an older save would undo newer moves
});

// collection index (SSE)
let indexEs = null, indexLog = [];
function startIndex() {
  if (indexEs) return;
  indexLog = [];
  indexEs = new EventSource('/api/index');
  renderSettings();
  const logIt = (cls, txt) => {
    indexLog.push(`<div><span class="ts"></span><span class="${cls}">${cls === 'err' ? '!' : '·'}</span><span class="${cls}">${esc(txt)}</span></div>`);
    const l = $('index-log'); if (l) { l.hidden = false; l.insertAdjacentHTML('beforeend', indexLog[indexLog.length - 1]); l.scrollTop = l.scrollHeight; }
  };
  indexEs.addEventListener('progress', (e) => {
    const p = JSON.parse(e.data);
    if (p.error) return logIt('err', `${p.method}: ${p.error}${p.file ? ` (${p.file})` : ''}`);
    const bar = $('index-bar'); if (bar) bar.firstElementChild.style.width = (p.total ? Math.round(p.done / p.total * 100) : 100) + '%';
    if (p.done === 0) logIt('same', `${p.method}: ${plural(p.total, 'nieuw bestand', 'nieuwe bestanden')} te indexeren`);
    else logIt('ok', `${p.method}: ${p.done}/${p.total} · ${p.file}`);
  });
  const end = (msg, err) => { indexEs?.close(); indexEs = null; toast(msg, err); loadMethods().then(renderSettings); };
  indexEs.addEventListener('done', (e) => {
    const d = JSON.parse(e.data);
    for (const s of d.summary) if (!s.error) logIt('ok', `${s.method}: ${s.added} toegevoegd, ${s.total} in index${s.errors ? `, ${s.errors} fouten` : ''}`); // errors were already logged via progress
    if (d.summary.every(s => s.error)) { logIt('err', 'Geen indexeerbare methode actief: zet een "Eigen collectie"-methode aan die geïnstalleerd is.'); return end('Geen indexeerbare methode actief', true); }
    end(d.aborted ? 'Indexeren gestopt' : `Index bijgewerkt (${plural(d.files, 'bestand', 'bestanden')} in de collectie)`);
  });
  indexEs.addEventListener('error', (e) => {
    let msg = 'Indexeren mislukt (verbinding verbroken)';
    try { if (e.data) msg = JSON.parse(e.data).message; } catch {}
    logIt('err', msg); end(msg, true);
  });
}

// view toggle
function setView(v) {
  state.view = v; save();
  $('settings').hidden = v !== 'settings';
  document.querySelector('section.work').hidden = v === 'settings';
  $('view-btn').textContent = v === 'settings' ? '← Terug naar scannen' : 'Instellingen';
  if (v === 'settings') { renderSettings(); loadMethods(); }
}
$('view-btn').onclick = () => setView(state.view === 'settings' ? 'scan' : 'settings');

// ------------------------------------------------------------------ boot
function renderAll() { renderQueue(); renderTabs(); renderResult(); }
setView(state.view || 'scan');
renderAll();
window.addEventListener('beforeunload', (e) => { if (running) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
