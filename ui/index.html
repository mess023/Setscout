<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setscout</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%233b82f6'/><circle cx='16' cy='16' r='4' fill='%2309090b'/></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b; --surface: #111113; --surface-2: #18181b; --surface-3: #1f1f23;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.16);
    --text: #fafafa; --text-2: rgba(255,255,255,0.66); --text-3: rgba(255,255,255,0.5);
    --accent: #3b82f6; --accent-soft: rgba(59,130,246,0.15);
    --green: #4ade80; --green-soft: rgba(74,222,128,0.14);
    --amber: #fbbf24; --amber-soft: rgba(251,191,36,0.14);
    --red: #f87171; --red-soft: rgba(248,113,113,0.14);
    /* method families: one colour each, used in timeline blocks, row borders and tags */
    --m-cloud: #3b82f6; --m-local: #a78bfa; --m-ref: #2dd4bf; --m-emu: #9ca3af; --m-none: #52525b;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    --mono: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace;
    --r: 10px;
  }
  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: 52px 1fr; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  [title] { cursor: help; }
  button[title], .file[title], .dir[title], .qrow[title], .tl [title], summary[title] { cursor: pointer; }
  abbr { text-decoration: underline dotted var(--text-3); text-underline-offset: 3px; }

  /* ---- header ---- */
  header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -0.01em; font-size: 15px; }
  .logo .dot { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at center, var(--bg) 0 3px, var(--accent) 4px); box-shadow: 0 0 16px var(--accent-soft); }
  .logo span { color: var(--text-3); font-weight: 400; margin-left: 4px; }
  .hdr-right { display: flex; align-items: center; gap: 12px; }
  .health { display: flex; gap: 10px; font-size: 12px; color: var(--text-2); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 11.5px; }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .pill.ok::before { background: var(--green); } .pill.bad::before { background: var(--red); } .pill.warn::before { background: var(--amber); }
  button.pill:hover { border-color: var(--border-strong); }

  /* ---- layout ---- */
  main { display: grid; grid-template-columns: 330px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--border); background: var(--surface); display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
  section.work { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .panel-title .btn { text-transform: none; letter-spacing: 0; }
  .panel-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* ---- browser ---- */
  .pathbar { display: flex; gap: 6px; padding: 0 12px 10px; }
  .pathbar input { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-family: var(--mono); font-size: 12px; outline: none; }
  .pathbar input:focus { border-color: var(--accent); }
  .ibtn { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-2); flex: none; }
  .ibtn:hover { color: var(--text); border-color: var(--border-strong); }
  .tree { overflow: auto; padding: 4px 8px 12px; }
  .dir, .file { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px; user-select: none; }
  .dir:hover, .file:hover { background: var(--surface-2); }
  .dir { color: var(--text-2); } .dir .name { color: var(--text); }
  .file .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .size { font-size: 11px; color: var(--text-3); font-family: var(--mono); flex: none; }
  .file .add { opacity: 0; width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; line-height: 1; flex: none; }
  .file:hover .add { opacity: 1; }
  .file.queued .add { opacity: 1; background: var(--green-soft); color: var(--green); }
  .empty { padding: 20px 12px; color: var(--text-3); font-size: 13px; text-align: center; }
  svg.ico { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- queue: one row per set, the row IS the tab ---- */
  .queue { border-bottom: 1px solid var(--border); background: var(--surface); }
  .queue-body { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 0 16px 12px; align-items: start; }
  .qrows { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-height: 168px; overflow: auto; padding-right: 2px; }
  .qrow { display: grid; grid-template-columns: 20px 10px minmax(120px, 1fr) minmax(80px, 180px) 44px auto; align-items: center; gap: 10px; padding: 6px 10px 6px 8px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid transparent; }
  .qrow:hover { background: var(--surface-3); }
  .qrow.active { border-left-color: var(--accent); background: var(--surface-3); }
  .qrow .num { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); text-align: right; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-3); flex: none; }
  .dot.bezig { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: pulse 1.2s ease-in-out infinite; }
  .dot.klaar { background: var(--green); } .dot.fout { background: var(--red); } .dot.gestopt { background: var(--amber); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(59,130,246,0.05); } }
  .qrow .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 13px; }
  .mini { height: 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; position: relative; }
  .mini i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width .4s; }
  .mini.klaar i { background: var(--green); } .mini.fout i { background: var(--red); } .mini.gestopt i { background: var(--amber); }
  .qrow .cnt { font-family: var(--mono); font-size: 12px; color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
  .qrow .cnt small { color: var(--text-3); font-size: 10px; }
  .qrow .acts { display: flex; gap: 2px; }
  .qrow .rm { color: var(--text-3); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
  .qrow .rm:hover { color: var(--red); background: var(--red-soft); }
  .qrow .redo:hover { color: var(--accent); background: var(--accent-soft); }
  .qrow .rm:disabled { opacity: 0.3; cursor: default; }
  .controls { display: flex; flex-direction: column; gap: 8px; min-width: 250px; }
  .ctl-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
  .ctl-line input { width: 54px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; text-align: right; font-family: var(--mono); font-size: 12px; outline: none; }
  .ctl-line input:focus { border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 8px; font-weight: 550; font-size: 13px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #2f6fe0; }
  .btn.stop { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .btn.stop:hover { background: rgba(248,113,113,0.25); }
  .btn.danger { color: var(--red); } .btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  /* ---- timeline (shared by live scan and result) ---- */
  .tl { position: relative; height: 30px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  .tl .blk { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; background: var(--m-cloud); opacity: .85; min-width: 2px; }
  .tl .blk:hover { opacity: 1; outline: 1px solid #fff; }
  .tl .blk.weak { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.35) 0 4px, transparent 4px 8px); }
  .tl .blk.doubt::before { content: ''; position: absolute; left: -1px; top: -4px; border: 5px solid transparent; border-top: 6px solid var(--amber); }
  .tl .gap { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; background: repeating-linear-gradient(135deg, rgba(248,113,113,.55) 0 3px, transparent 3px 7px); border: 1px dashed rgba(248,113,113,.7); }
  .tl .tick { position: absolute; top: 6px; bottom: 6px; width: 2px; border-radius: 1px; }
  .tl .tick.match { background: var(--green); } .tl .tick.same { background: rgba(255,255,255,.35); } .tl .tick.none, .tl .tick.skip { background: rgba(255,255,255,.1); } .tl .tick.error { background: var(--red); }
  .tl .head { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 8px #fff; }
  .tl .todo { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(255,255,255,.03) 6px 12px); }
  .tl-axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); padding: 2px 2px 0; }

  /* ---- results ---- */
  .results { display: grid; grid-template-rows: 1fr; min-height: 0; }
  .result-body { overflow: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .result-body > * { flex: none; } /* column flex + overflow: fixed-height children (timeline) would otherwise shrink to 0 */
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .kpis { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-right: auto; }
  .kpi { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
  .kpi b { font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; }
  .kpi.amber { border-color: rgba(251,191,36,.4); color: var(--amber); } .kpi.amber b { color: var(--amber); }
  .kpi.red { border-color: rgba(248,113,113,.4); color: var(--red); } .kpi.red b { color: var(--red); }
  .kpi.muted { color: var(--text-3); }
  button.kpi:hover { background: var(--surface-3); }
  .kpi .act { margin-left: 2px; padding: 0 6px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); font-size: 11px; }
  .kpi .act:hover { color: var(--red); background: var(--red-soft); }
  .menu { position: relative; }
  .menu > summary { list-style: none; } .menu > summary::-webkit-details-marker { display: none; }
  .menu-items { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 230px; background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 10px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 2px; }
  .menu-items button { text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 13px; display: flex; justify-content: space-between; gap: 10px; }
  .menu-items button small { color: var(--text-3); }
  .menu-items button:hover { background: var(--surface-2); }
  .menu-note { font-size: 11px; color: var(--text-3); padding: 6px 10px 4px; border-top: 1px solid var(--border); margin-top: 4px; }
  .notice { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r); border: 1px solid; font-size: 13px; }
  .notice.fout { background: var(--red-soft); border-color: rgba(248,113,113,.4); color: var(--red); }
  .notice.gestopt { background: var(--amber-soft); border-color: rgba(251,191,36,.4); color: var(--amber); }
  .notice .msg { flex: 1; min-width: 0; }
  .notice .btn { color: var(--text); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; table-layout: fixed; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); padding: 10px 8px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  th.sort { cursor: pointer; } th.sort:hover { color: var(--text); }
  td { padding: 4px 4px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: rgba(255,255,255,0.015); }
  tr.hl td { background: var(--accent-soft); }
  td.n { font-family: var(--mono); font-size: 12px; color: var(--text-3); text-align: right; padding-right: 8px; white-space: nowrap; border-left: 3px solid var(--m-none); }
  tr.fam-cloud td.n { border-left-color: var(--m-cloud); } tr.fam-local td.n { border-left-color: var(--m-local); } tr.fam-ref td.n { border-left-color: var(--m-ref); } tr.fam-emu td.n { border-left-color: var(--m-emu); }
  th.c-n { width: 54px; } th.c-t { width: 88px; } th.c-a { width: 28%; } th.c-x { width: 36px; }
  tr.weak td { opacity: 0.65; }
  tr.weak td input:focus { opacity: 1; }
  .badge1 { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); font-size: 10px; font-family: var(--mono); }
  td input { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; outline: none; text-overflow: ellipsis; }
  td input:hover { border-color: var(--border); }
  td input:focus { border-color: var(--accent); background: var(--surface-2); }
  td.t input { font-family: var(--mono); font-size: 12.5px; }
  td.t input.bad { border-color: var(--red); }
  td.t input.doubt { color: var(--amber); }
  td .extras { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); padding: 0 8px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td .del { color: var(--text-3); width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; }
  td .del:hover { color: var(--red); background: var(--red-soft); }
  tr.gaprow td { padding: 0; border-bottom: 1px dashed rgba(248,113,113,.5); background: transparent; }
  tr.gaprow button { width: 100%; padding: 3px 12px; font-size: 11px; color: var(--red); text-align: left; display: flex; gap: 10px; align-items: center; }
  tr.gaprow button:hover { background: var(--red-soft); }
  tr.gaprow button span { color: var(--text-3); }
  .mtag { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
  .mtag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--m-none); }
  .mtag.fam-cloud::before { background: var(--m-cloud); } .mtag.fam-local::before { background: var(--m-local); } .mtag.fam-ref::before { background: var(--m-ref); } .mtag.fam-emu::before { background: var(--m-emu); }
  .log { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); font-family: var(--mono); font-size: 12px; max-height: 240px; overflow: auto; padding: 8px 12px; color: var(--text-2); }
  .log div { display: grid; grid-template-columns: 70px 16px 1fr; gap: 10px; padding: 2px 0; }
  .log .ts { color: var(--text-3); }
  .log .ok { color: var(--green); } .log .same { color: var(--text-3); } .log .none { color: var(--text-3); } .log .err { color: var(--red); }
  .log .mtag { margin-left: 8px; }
  details.sub > summary { color: var(--text-3); font-size: 12px; cursor: pointer; user-select: none; }
  details.sub > summary:hover { color: var(--text-2); }
  details.sub[open] > summary { margin-bottom: 8px; }
  .live-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
  .live-meta b { color: var(--text); font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 14px; }
  .live-meta .status { margin-left: auto; }
  .status { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .status.bezig { background: var(--accent-soft); color: #93c5fd; }
  .placeholder { height: 100%; display: grid; place-items: center; color: var(--text-3); text-align: center; padding: 40px; }
  .steps { display: flex; gap: 28px; align-items: flex-start; }
  .step { width: 150px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-3); }
  .step .ic { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; color: var(--text-3); }
  .step .ic svg { width: 20px; height: 20px; }
  .step.on { color: var(--text); } .step.on .ic { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .step.done .ic { border-color: var(--green); color: var(--green); }
  .steps .arrow { align-self: center; color: var(--text-3); margin-top: -18px; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; max-width: 480px; }
  .toast.show { opacity: 1; transform: none; pointer-events: auto; }
  .toast.err { border-color: var(--red); color: var(--red); cursor: pointer; }
  .warn { font-size: 12px; color: var(--amber); }

  /* ---- settings ---- */
  .settings { overflow: auto; min-height: 0; position: relative; }
  .subnav { position: sticky; top: 0; z-index: 4; display: flex; gap: 4px; padding: 8px 20px; background: rgba(9,9,11,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .subnav a { color: var(--text-2); text-decoration: none; font-size: 12.5px; padding: 5px 10px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
  .subnav a:hover { background: var(--surface-2); color: var(--text); }
  .subnav a b { font-family: var(--mono); font-weight: 500; font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); }
  .subnav a b.amber { background: var(--amber-soft); color: var(--amber); } .subnav a b.red { background: var(--red-soft); color: var(--red); } .subnav a b.ok { background: var(--green-soft); color: var(--green); }
  .settings-body { max-width: 1180px; padding: 6px 20px 60px; display: flex; flex-direction: column; gap: 6px; }
  .settings h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin: 20px 0 6px; display: flex; gap: 10px; align-items: baseline; scroll-margin-top: 52px; }
  .settings h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; }
  .strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 8px; font-size: 12.5px; }
  .strip .arrow { color: var(--text-3); }
  .strip .chipm { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); }
  .strip .chipm.skip { border-style: dashed; color: var(--text-3); background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.03) 6px 12px); }
  .strip .chipm:hover { border-color: var(--text-3); }
  .strip .end { color: var(--text-3); font-family: var(--mono); }
  .strip .lbl { color: var(--text-3); margin-right: 4px; }
  .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .sdot.ok { background: var(--green); } .sdot.key, .sdot.index { background: var(--amber); } .sdot.tool { background: var(--red); } .sdot.na { background: var(--m-none); }
  .mlist { display: flex; flex-direction: column; gap: 6px; }
  .mcard { display: grid; grid-template-columns: 24px 22px 40px 1fr auto 32px; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--text-3); scroll-margin-top: 60px; }

  @media (max-width: 1200px) { .qrow { grid-template-columns: 20px 10px minmax(100px, 1fr) 90px 40px auto; } th.c-a { width: 32%; } }

<body>

<header>
  <div class="logo"><i class="dot"></i>Setscout <span>track IDs uit DJ-sets</span></div>
  <div class="hdr-right">
    <div class="health" id="health"></div>
    <button class="btn sm" id="view-btn" title="Herkenningsmethodes aan/uit zetten, instellen en in volgorde zetten; collectie indexeren">Instellingen</button>
  </div>
</header>

<main>
  <aside>
    <div class="panel-title">Bestanden <span id="startdir-btn" class="btn sm" title="Terug naar de map waar Setscout is gestart">Startmap</span></div>
    <div class="pathbar">
      <button class="ibtn" id="up" title="Map omhoog"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      <input id="path" spellcheck="false" placeholder="Pad… (Enter)">
      <button class="ibtn" id="drives" title="Stations (schijven) tonen"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></button>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <section class="work">
    <div class="queue">
      <div class="panel-title">
        <span>Wachtrij <span id="queue-count" style="font-weight:400;text-transform:none;letter-spacing:0"></span></span>
        <button class="btn sm" id="queue-fold" title="Alleen de actieve set tonen / alles tonen" hidden>▾</button>
      </div>
      <div class="queue-body">
        <div class="qrows" id="sets"></div>
        <div class="controls">
          <div class="ctl-line">
            <abbr title="Afstand in seconden tussen twee herkenningsmomenten. Kleiner = nauwkeuriger maar trager (Shazam: 3 s pauze per stap).">Stap</abbr><input id="step" type="number" min="10" max="120" step="5" value="30"><span>s</span>
            <span style="width:8px"></span>
            <abbr title="Lengte van het audiofragment (fingerprint) dat per stap naar de herkenning gaat. 18 s is de standaard.">Fragment</abbr><input id="segment" type="number" min="5" max="30" step="1" value="18"><span>s</span>
          </div>
          <button class="btn primary" id="start" title="Scan alle sets in de wachtrij achter elkaar">Scannen</button>
        </div>
      </div>
    </div>

    <div class="results">
      <div class="result-body" id="result"></div>
    </div>
  </section>

  <section class="settings" id="settings" hidden>
    <nav class="subnav" id="subnav"></nav>
    <div class="settings-body" id="settings-body"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
// ------------------------------------------------------------------ state
const LS_KEY = 'setscout.v1';
const state = loadState();
let es = null;            // active EventSource
let running = false;      // queue runner active
let browsePath = '';
let scanStartedAt = 0;    // for the ETA of the running scan
let highlight = null;     // KPI chip filter: 'doubt' | 'weak' | 'gap' | null

function loadState() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && Array.isArray(s.sets)) return s; } catch {}
  return { sets: [], activeId: null, step: 30, segment: 18 };
}
function save() {
  const copy = { ...state, sets: state.sets.map(s => ({ ...s, log: (s.log || []).slice(-400) })) };
  localStorage.setItem(LS_KEY, JSON.stringify(copy));
}
// A set that was mid-scan when the page was closed/refreshed can't resume — reset it to the queue.
for (const s of state.sets) if (s.status === 'bezig') { s.status = 'wachtrij'; s.pct = 0; }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const active = () => state.sets.find(s => s.id === state.activeId);

// ------------------------------------------------------------------ time helpers
function fmt(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function parseTime(str) {
  const m = /^(?:(\d{1,2}):)?([0-5]?\d):([0-5]\d)$/.exec(String(str).trim());
  if (!m) return null;
  return (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]);
}
const fmtSize = (b) => b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' kB';
const fmtMin = (sec) => sec < 90 ? `${Math.max(1, Math.round(sec))} s` : `${Math.round(sec / 60)} min`;

// method family (colour) from a method label, e.g. "Shazam −4% vinyl", "AudD + Google", "MixesDB (volgorde)"
function fam(method) {
  const m = String(method || '').split(' + ')[0];
  if (/^(Shazam|AudD|AudioTag|AcoustID)/i.test(m)) return 'cloud';
  if (/^(Olaf|audfprint|Panako|Dejavu|NeuralFP|PeakNetFP)/i.test(m)) return 'local';
  if (/^(trackid|1001|MixesDB)/i.test(m)) return 'ref';
  if (/^Google/i.test(m)) return 'emu';
  return 'none';
}
const famOfKind = (m) => m.local ? 'local' : m.group === 'reference' ? 'ref' : m.kind === 'Emulator' ? 'emu' : m.kind === 'Cloud' ? 'cloud' : 'none';

// ------------------------------------------------------------------ toast (errors stay until clicked)
let toastTimer;
function toast(msg, err = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  if (!err) toastTimer = setTimeout(() => t.className = 'toast', 3200);
}
$('toast').onclick = () => { $('toast').className = 'toast'; };

// ------------------------------------------------------------------ health
fetch('/api/health').then(r => r.json()).then(h => {
  $('health').innerHTML =
    `<span class="pill ${h.ffmpeg && h.ffprobe ? 'ok' : 'bad'}" title="ffmpeg knipt de audiofragmenten; zonder ffmpeg kan er niet gescand worden">ffmpeg ${h.ffmpeg && h.ffprobe ? 'gevonden' : 'ontbreekt'}</span>` +
    `<button class="pill" id="chain-pill" title="Herkenningsketen — klik om te wijzigen">keten…</button>`;
  $('chain-pill').onclick = () => setView('settings');
  loadMethods();
  if (!browsePath) browse(h.startDir);
  $('startdir-btn').onclick = () => browse(h.startDir);
}).catch(() => { $('health').innerHTML = '<span class="pill bad">server onbereikbaar</span>'; });

// ------------------------------------------------------------------ file browser
const ICON_DIR = '<svg class="ico" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const ICON_AUDIO = '<svg class="ico" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>';
const ICON_DRIVE = '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 12h.01"/></svg>';

async function browse(path) {
  const r = await fetch('/api/browse?path=' + encodeURIComponent(path || ''));
  const d = await r.json();
  if (d.error) return toast(d.error, true);
  browsePath = d.path; $('path').value = d.path;
  $('up').onclick = () => d.parent != null && browse(d.parent);
  $('up').disabled = d.parent == null;
  const queued = new Set(state.sets.map(s => s.path));
  const isDrives = !d.path;
  let html = '';
  for (const dir of d.dirs) html += `<div class="dir" data-path="${esc(dir.path)}">${isDrives ? ICON_DRIVE : ICON_DIR}<span class="name">${esc(dir.name)}</span></div>`;
  for (const f of d.files) html += `<div class="file ${queued.has(f.path) ? 'queued' : ''}" data-path="${esc(f.path)}" data-name="${esc(f.name)}" title="${queued.has(f.path) ? 'Staat al in de wachtrij' : 'Klik om toe te voegen aan de wachtrij'}">${ICON_AUDIO}<span class="name">${esc(f.name)}</span><span class="size">${fmtSize(f.size)}</span><span class="add">${queued.has(f.path) ? '✓' : '+'}</span></div>`;
  if (!html) html = '<div class="empty">Geen submappen of audiobestanden</div>';
  $('tree').innerHTML = html;
}
$('tree').addEventListener('click', (e) => {
  const dir = e.target.closest('.dir'); if (dir) return browse(dir.dataset.path);
  const f = e.target.closest('.file'); if (f) addSet(f.dataset.path, f.dataset.name);
});
$('path').addEventListener('keydown', (e) => { if (e.key === 'Enter') browse(e.target.value); });
$('drives').onclick = () => browse('drives');

// ------------------------------------------------------------------ queue
function addSet(path, name) {
  if (state.sets.some(s => s.path === path)) return toast('Staat al in de wachtrij');
  state.sets.push({ id: uid(), path, name, status: 'wachtrij', pct: 0, tracks: [], log: [], duration: null });
  if (!state.activeId) state.activeId = state.sets[state.sets.length - 1].id;
  save(); renderAll(); browse(browsePath);
}
function removeSet(id) {
  const s = state.sets.find(s => s.id === id);
  if (!s || s.status === 'bezig') return;
  if (s.tracks.length && !confirm(`"${s.name}" verwijderen inclusief ${s.tracks.length} gevonden tracks?`)) return;
  state.sets = state.sets.filter(s => s.id !== id);
  if (state.activeId === id) state.activeId = state.sets[0]?.id || null;
  save(); renderAll(); browse(browsePath);
}
function requeueSet(id) {
  const s = state.sets.find(s => s.id === id);
  if (!s || s.status === 'bezig') return;
  if (s.tracks.length && !confirm(`"${s.name}" opnieuw scannen? ${plural(s.tracks.length, 'huidige track wordt', 'huidige tracks worden')} vervangen (incl. bewerkingen).`)) return;
  s.status = 'wachtrij'; s.pct = 0; s.tracks = []; s.log = []; s.error = null; save(); renderAll();
}
const STATUS_LABEL = { wachtrij: 'In wachtrij', bezig: 'Bezig', klaar: 'Klaar', fout: 'Fout', gestopt: 'Gestopt' };

function renderQueue() {
  const el = $('sets');
  const n = state.sets.length;
  $('queue-count').textContent = n ? `${n} set${n > 1 ? 's' : ''}` : '';
  $('queue-fold').hidden = n < 2;
  $('queue-fold').textContent = state.queueFold ? '▸' : '▾';
  $('queue-fold').title = state.queueFold ? 'Alle sets tonen' : 'Alleen de actieve set tonen';
  const rows = state.queueFold ? state.sets.filter(s => s.id === state.activeId || s.status === 'bezig') : state.sets;
  if (!n) el.innerHTML = '<div class="empty" style="text-align:left;padding:8px 4px">Kies links een bestand om toe te voegen.</div>';
  else el.innerHTML = rows.map((s) => {
    const i = state.sets.indexOf(s);
    const pct = s.status === 'bezig' ? s.pct : s.status === 'wachtrij' ? 0 : 100;
    const cnt = s.status === 'wachtrij' ? '' : s.status === 'bezig' ? `${s.pct}<small>%</small>` : `${s.tracks.length}<small> tr</small>`;
    return `<div class="qrow ${s.id === state.activeId ? 'active' : ''}" data-id="${s.id}" title="${esc(s.path)} — ${STATUS_LABEL[s.status]}">
      <span class="num">${i + 1}</span>
      <i class="dot ${s.status}"></i>
      <span class="title">${esc(s.name)}</span>
      <span class="mini ${s.status}" title="${s.status === 'bezig' ? `Voortgang ${s.pct}%` : STATUS_LABEL[s.status]}"><i style="width:${pct}%"></i></span>
      <span class="cnt">${cnt}</span>
      <span class="acts">${s.status !== 'wachtrij' && s.status !== 'bezig' ? `<button class="rm redo" title="Opnieuw scannen (huidige tracks worden vervangen)">↻</button>` : ''}<button class="rm" title="Uit wachtrij verwijderen" ${s.status === 'bezig' ? 'disabled' : ''}>✕</button></span>
    </div>`;
  }).join('');
  const pending = state.sets.filter(s => s.status === 'wachtrij').length;
  const b = $('start');
  if (running) { b.className = 'btn stop'; b.textContent = 'Stop'; b.disabled = false; b.title = 'Stop na het huidige fragment; wat al herkend is blijft staan'; }
  else { b.className = 'btn primary'; b.textContent = pending ? `Scannen (${pending})` : 'Scannen'; b.disabled = !pending; b.title = 'Scan alle sets in de wachtrij achter elkaar'; }
}
$('sets').addEventListener('click', (e) => {
  const row = e.target.closest('.qrow'); if (!row) return;
  if (e.target.closest('.redo')) return requeueSet(row.dataset.id);
  if (e.target.closest('.rm')) return removeSet(row.dataset.id);
  highlight = null; state.activeId = row.dataset.id; save(); renderAll();
});
$('queue-fold').onclick = () => { state.queueFold = !state.queueFold; save(); renderQueue(); };
$('step').value = state.step; $('segment').value = state.segment;
$('step').onchange = (e) => { state.step = Math.min(120, Math.max(10, +e.target.value || 30)); e.target.value = state.step; save(); };
$('segment').onchange = (e) => { state.segment = Math.min(30, Math.max(5, +e.target.value || 18)); e.target.value = state.segment; save(); };

// ------------------------------------------------------------------ scanning
$('start').onclick = async () => {
  if (running) { running = false; renderQueue(); await fetch('/api/scan/stop'); toast('Stoppen na het huidige fragment…'); return; }
  running = true; renderQueue(); runNext();
};

function runNext() {
  const s = state.sets.find(s => s.status === 'wachtrij');
  if (!s || !running) { running = false; renderQueue(); if (!s) toast('Wachtrij afgerond'); return; }
  s.status = 'bezig'; s.pct = 0; s.log = []; s.tracks = []; s.error = null; state.activeId = s.id;
  scanStartedAt = Date.now(); highlight = null;
  save(); renderAll();
  const url = `/api/scan?file=${encodeURIComponent(s.path)}&step=${state.step}&segment=${state.segment}`;
  es = new EventSource(url);
  es.addEventListener('start', (e) => { const d = JSON.parse(e.data); s.duration = d.duration; s.total = d.total; s.step = d.step; s.segment = d.segment; renderResult(); });
  es.addEventListener('segment', (e) => {
    const d = JSON.parse(e.data);
    s.pct = d.pct; s.log.push(d);
    renderQueue(); appendLog(s, d);
  });
  es.addEventListener('note', (e) => { const d = JSON.parse(e.data); const l = { timestamp: '', status: 'note', message: d.message }; s.log.push(l); appendLog(s, { ...l, pct: s.pct }); });
  es.addEventListener('done', (e) => {
    const d = JSON.parse(e.data);
    for (const r of d.reference || []) s.log.push({ timestamp: '', status: r.error ? 'error' : 'note', message: r.error ? `${r.method}: ${r.error}` : r.untimed
      ? `${r.method}: lijst zonder tijden (${plural(r.tracks, 'track', 'tracks')}): ${r.confirmed} herkende tracks staan erin, ${plural(r.filled, 'fragment', 'fragmenten')} op volgorde aangevuld${r.swapped ? ' (lijst stond als Titel — Artiest, omgedraaid)' : ''}`
      : `${r.method}: ${plural(r.filled, 'fragment', 'fragmenten')} aangevuld uit ${plural(r.tracks, 'track', 'tracks')}` });
    s.tracks = d.tracks.map(normalize); s.duration = d.duration;
    s.status = d.aborted ? 'gestopt' : 'klaar'; s.pct = 100;
    es.close(); es = null; save(); renderAll();
    if (d.aborted) { running = false; renderQueue(); toast('Scan gestopt — deelresultaat bewaard'); return; }
    runNext();
  });
  es.addEventListener('error', (e) => {
    // Custom `error` event from server (has data) or connection failure (no data).
    let msg = 'Verbinding met de server verbroken';
    try { if (e.data) msg = JSON.parse(e.data).message; } catch {}
    if (es) { es.close(); es = null; }
    s.status = 'fout'; s.error = msg; running = false;
    save(); renderAll(); toast(msg, true);
  });
}
const normalize = (t) => ({ id: uid(), start_sec: t.start_sec, end_sec: t.end_sec, artist: t.artist || '', title: t.title || '', album: t.album || '', year: t.year || '', hits: t.hits ?? null,

function exportSet(s, kind) {
  const base = s.name.replace(/\.[^.]+$/, '');
  const tracks = [...s.tracks].sort((a, b) => a.start_sec - b.start_sec);
  let body, mime;
  if (kind === 'txt') {
    body = tracks.map((t, i) => `${String(i + 1).padStart(2, '0')}. ${fmt(t.start_sec)} - ${fmt(t.end_sec)}  ${t.artist} - ${t.title}${t.method ? `  [${t.method}]` : ''}`).join('\n') + '\n';
    mime = 'text/plain';
  } else if (kind === 'csv') {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    body = ['nr,van,tot,van_sec,tot_sec,artiest,titel,album,jaar,methode,bpm,key,isrc']
      .concat(tracks.map((t, i) => [i + 1, fmt(t.start_sec), fmt(t.end_sec), t.start_sec, t.end_sec, t.artist, t.title, t.album, t.year, t.method, t.bpm, t.key, t.isrc].map(q).join(',')))
      .join('\r\n') + '\r\n';
    body = '﻿' + body; // BOM so Excel reads UTF-8 (accented artist names)
    mime = 'text/csv';
  } else {
    body = JSON.stringify({
      source: s.name, path: s.path, duration: s.duration, step: s.step || state.step, exported: new Date().toISOString(),
      tracks: tracks.map((t, i) => ({ nr: i + 1, start: fmt(t.start_sec), end: fmt(t.end_sec), start_sec: t.start_sec, end_sec: t.end_sec, artist: t.artist, title: t.title, album: t.album, year: t.year, detections: t.hits, start_exact: t.exact, start_agree: t.agree || null, start_spread_sec: t.spread, method: t.method || null, bpm: t.bpm || null, key: t.key || null, isrc: t.isrc || null, mbid: t.mbid || null, label: t.label || null, versions: t.versions || null })),
    }, null, 2);
    mime = 'application/json';
  }
  saveFile(`${base}_tracklist.${kind}`, body, mime, kind);
}

/** Native "Opslaan als"-dialoog (File System Access API, Chrome/Edge); anders gewone download naar Downloads. */
async function saveFile(name, body, mime, ext) {
  if (cfg?.export.target === 'server') {
    const r = await fetch('/api/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, body }) });
    const d = await r.json();
    return d.error ? toast(d.error, true) : toast(`Opgeslagen op de server: ${d.path}`);
  }
  if (window.showSaveFilePicker) {
    try {
      const handle = await showSaveFilePicker({ suggestedName: name, id: 'setscout-export', types: [{ description: ext.toUpperCase(), accept: { [mime]: ['.' + ext] } }] });
      const w = await handle.createWritable(); await w.write(body); await w.close();
      return toast(`Opgeslagen: ${handle.name}`);
    } catch (e) {
      if (e.name === 'AbortError') return; // gebruiker annuleerde
      console.warn('showSaveFilePicker mislukt, val terug op download', e);
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: mime + ';charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`Opgeslagen als ${name} (map Downloads)`);
}

async function saveSettings(patch, rerender = true) {
  const r = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
  const d = await r.json();
  if (d.error) { toast(d.error, true); return false; }
  cfg = d; renderChainPill();
  if (rerender) renderSettings(); else updateStatusPills();
  toast('Opgeslagen');
  return true;
}
const inChain = (m) => m.group === 'recognize' || m.group === 'reference';
const chain = () => cfg ? cfg.methods.filter(m => inChain(m) && m.values.enabled) : [];
function renderChainPill() {
  const p = $('chain-pill'); if (!p || !cfg) return;
  const on = chain(), ready = on.filter(m => m.state === 'ok');
  p.className = 'pill ' + (ready.length ? (ready.length < on.length ? 'warn' : 'ok') : 'bad');
  p.textContent = `keten: ${ready.map(m => m.label).join(' → ') || 'leeg'}`;
  p.title = 'Herkenningsketen (pipeline): volgorde waarin elk fragment wordt geprobeerd. ' +
    (on.length > ready.length ? `Niet klaar en dus overgeslagen: ${on.filter(m => m.state !== 'ok').map(m => `${m.label} (${ST_LABEL[m.state]})`).join(', ')}. ` : '') + 'Klik om te wijzigen.';
}

function fieldHtml(m, f) {
  const v = m.values[f.key] ?? '';
  const tip = f.tip ? ` title="${esc(f.tip)}"` : '';
  const lab = `<abbr${tip}>${esc(f.label)}</abbr>`;
  if (f.type === 'select') return `<label class="field">${lab}<select data-key="${f.key}">${f.options.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  if (f.type === 'secret') {
    const set = m.secrets[f.key];
    return `<label class="field">${lab}<span style="display:flex;gap:6px"><input class="wide" type="password" autocomplete="off" data-key="${f.key}" placeholder="${set ? 'opgeslagen ••••' : 'nog niet ingesteld'}" title="${set ? 'Leeg laten = opgeslagen sleutel behouden; typ een nieuwe om te vervangen' : 'Plakken en Tab/Enter om op te slaan'}">${set ? `<button class="btn sm" data-clear="${f.key}" title="Opgeslagen sleutel verwijderen">Wis</button>` : ''}</span></label>`;
  }
  return `<label class="field">${lab}<input class="${f.type === 'number' ? '' : 'wide'}" type="${f.type === 'number' ? 'number' : 'text'}" step="any" spellcheck="false" data-key="${f.key}" value="${esc(v)}"></label>`;
}

function cardHtml(m, pos) {
  if (m.group === 'none') return `<div class="mcard na" data-id="${m.id}"><div class="mname"><b title="${esc(m.tip)}">${esc(m.label)}</b></div><span class="st" title="${esc(m.tip)}">${esc(m.msg)}</span></div>`;
  const on = m.values.enabled, open = openCards.has(m.id);
  const kindTip = m.local ? 'Eigen collectie: fingerprint van je eigen muziekbestanden (index onder Collectie)' : m.kind === 'Cloud' ? 'Cloud: online dienst met eigen database; het fragment wordt geüpload' : m.group === 'reference' ? 'Referentie: bestaande tracklist van de set' : esc(m.kind);
  return `<div class="mcard ${m.state} ${on ? '' : 'off'}" data-id="${m.id}">
    <button class="grip" aria-label="Verplaats ${esc(m.label)}" title="Sleep om de volgorde te wijzigen (of focus en ↑/↓)">⋮⋮</button>
    <span class="pos" title="${on ? 'Positie in de keten' : 'Uit'}">${on && inChain(m) ? pos : ''}</span>
    <label class="switch" title="${on ? 'Aan — klik om uit te zetten' : 'Uit — klik om aan te zetten'}"><input type="checkbox" data-act="toggle" ${on ? 'checked' : ''} aria-label="${esc(m.label)} aan/uit"><i></i></label>
    <div class="mname"><b title="${esc(m.tip)}">${esc(m.label)}</b><span class="kind fam-${famOfKind(m)}" title="${kindTip}"><i></i>${esc(m.kind)}</span></div>
    <span class="stwrap"><span class="st ${m.state}" data-st="${m.id}" title="${esc(m.msg)}${m.install ? ' — ' + esc(m.install) : ''}">${esc(stShort(m))}</span>${m.state === 'index' ? '<a class="st link" href="#sec-collectie" title="Naar Collectie: index bijwerken">→ Collectie</a>' : ''}</span>
    <button class="ibtn" data-act="expand" title="${open ? 'Instellingen inklappen' : 'Instellingen tonen'}" aria-expanded="${open}" ${!m.fields.length && !m.install ? 'disabled style="opacity:.3"' : ''}>${open ? '▴' : '▾'}</button>
    ${open ? `<div class="mfields"><div class="tipline">${esc(m.tip)}</div>${m.fields.map(f => fieldHtml(m, f)).join('')}${m.install ? `<div class="install" title="${m.state === 'key' ? 'Waar je de sleutel haalt' : 'Exacte installatie-instructie'}">${m.state === 'key' ? 'Sleutel' : 'Installeren'}: ${esc(m.install)}</div>` : ''}</div>` : ''}
  </div>`;
}

function chainStrip() {
  const on = chain();
  if (!on.length) return `<div class="strip"><span class="lbl">Keten</span><span class="st tool">leeg — zet een methode aan</span></div>`;
  return `<div class="strip"><span class="lbl" title="Volgorde waarin elk fragment wordt geprobeerd; gestreept = staat aan maar is niet klaar en wordt overgeslagen">Keten</span>${on.map(m =>
    `<button class="chipm ${m.state === 'ok' ? '' : 'skip'}" data-goto-card="${m.id}" title="${esc(m.msg)} — klik om de kaart te openen"><i class="sdot ${m.state}"></i>${esc(m.label)}</button>`).join('<span class="arrow">→</span>')}<span class="arrow">→</span><span class="end" title="Niets gevonden: fragment blijft onbekend">?</span></div>`;
}

function renderSettings() {
  const el = $('settings-body');
  if (!cfg) { el.innerHTML = '<div class="empty">Instellingen laden…</div>'; return; }
  const on = chain(), notReady = on.filter(m => m.state !== 'ok').length;
  const c = cfg.collection, ex = cfg.export;
  const locals = cfg.methods.filter(m => m.local && m.values.enabled);
  $('subnav').innerHTML = `
    <a href="#sec-chain">Keten <b class="${!on.length || notReady === on.length ? 'red' : notReady ? 'amber' : 'ok'}">${on.length - notReady}/${on.length}</b></a>
    <a href="#sec-enrich">Verrijking <b>${cfg.methods.filter(m => m.group === 'enrich' && m.values.enabled).length}</b></a>
    <a href="#sec-collectie">Collectie <b class="${c.roots.length ? '' : 'amber'}">${plural(c.roots.length, 'map', 'mappen')}</b></a>
    <a href="#sec-export">Export <b>${ex.target === 'server' ? 'server' : 'browser'}</b></a>`;
  let html = '';
  for (const [g, title, tip] of GROUPS) {
    const list = cfg.methods.filter(m => g === 'chain' ? inChain(m) : m.group === g);
    if (!list.length) continue;
    let pos = 0;
    html += `<h2 id="sec-${g}"><abbr title="${esc(tip)}">${title}</abbr>${g === 'chain' ? `<small>${on.length} aan${notReady ? ` · <span style="color:var(--amber)">${notReady} niet klaar</span>` : ''}</small>` : ''}</h2>
      ${g === 'chain' ? chainStrip() : ''}
      <div class="mlist" data-group="${g}">${list.map(m => cardHtml(m, m.values.enabled ? ++pos : 0)).join('')}</div>`;
  }
  html += `<h2 id="sec-collectie"><abbr title="Methodes met het label 'Eigen collectie' herkennen alleen tracks die in jouw muziekmappen staan. Daarvoor bouwt Setscout eerst een index (fingerprint-database) in de map data/index.">Collectie</abbr><small>${plural(c.roots.length, 'map', 'mappen')}</small></h2>
    <div class="box">
      <div class="chips">${c.roots.map(r => `<span class="chip">${esc(r)}<button data-rmroot="${esc(r)}" title="Map uit de collectie halen (index blijft staan)">✕</button></span>`).join('') || '<span class="row">Nog geen muziekmappen gekozen — blader links naar je muziekmap en klik op "+ Huidige map".</span>'}</div>
      <div class="row">
        <button class="btn sm" id="add-root" title="Voeg de map toe die nu links in de bestandsbrowser open staat">+ Huidige map</button>
        <span class="sfield"><abbr title="Aantal CPU-threads dat de fingerprint-tools tegelijk mogen gebruiken bij het indexeren (Olaf --threads, audfprint --ncores). Hoger = sneller, maar zwaarder voor de NAS.">Threads</abbr><input type="number" min="1" max="64" id="threads" value="${c.threads}"></span>
        <span style="flex:1"></span>
        <button class="btn sm primary" id="index-start" title="Nieuwe en gewijzigde bestanden toevoegen aan de index van elke actieve 'Eigen collectie'-methode" ${indexEs ? 'disabled' : ''}>Index bijwerken</button>
        <button class="btn sm danger" id="index-stop" title="Indexeren stoppen; wat al geïndexeerd is blijft" ${indexEs ? '' : 'disabled'}>Stop</button>
      </div>
      ${locals.length ? `<div class="locals">${locals.map(m => `<div><i class="sdot ${m.state}"></i><span>${esc(m.label)}</span><span class="n" title="${esc(m.msg)}">${esc(m.msg.replace(/^Klaar · /, ''))}</span></div>`).join('')}</div>` : '<div class="row" style="color:var(--text-3)">Geen "Eigen collectie"-methode aan: indexeren doet nu niets.</div>'}
      <div class="progress" id="index-bar" ${indexEs ? '' : 'hidden'}><i style="width:0%"></i></div>
      <details class="sub" ${indexLog.length ? 'open' : ''} ${indexLog.length ? '' : 'hidden'} id="index-details"><summary>Indexlog</summary><div class="log" id="index-log">${indexLog.join('')}</div></details>
    </div>`;
  html += `<h2 id="sec-export"><abbr title="Waar de knop Opslaan het bestand neerzet.">Export</abbr></h2>
    <div class="box">
      <div class="row">
        <span class="seg"><button data-ext="browser" class="${ex.target !== 'server' ? 'on' : ''}" title="Opslaan-dialoog van de browser. Werkt alleen via localhost of HTTPS (secure context); anders gewone download naar de map Downloads.">In de browser</button><button data-ext="server" class="${ex.target === 'server' ? 'on' : ''}" title="Setscout schrijft het bestand op de server/NAS zelf. Handig in Docker/TrueNAS via http://ip:poort.">Op de server</button></span>
        <span class="sfield"><abbr title="Leeg = standaardmap. Moet binnen de toegestane mappen liggen.">Map</abbr><input class="wide" id="export-dir" spellcheck="false" placeholder="${esc(cfg.exportDefault)}" value="${esc(ex.dir)}" style="width:320px;text-align:left"></span>
        <button class="btn sm" id="export-here" title="Gebruik de map die links in de bestandsbrowser open staat">Huidige map</button>
      </div>
      ${!window.isSecureContext && ex.target !== 'server' ? '<div class="warn">Deze pagina is niet via HTTPS/localhost geopend: de browser-dialoog werkt niet, exports gaan naar Downloads. Kies "Op de server" om op de NAS op te slaan.</div>' : ''}
    </div>`;
  // full re-render replaces the inputs → put focus back where the user is now (e.g. after Tab)
  const a = document.activeElement, fKey = a?.dataset?.key, fCard = a?.closest?.('.mcard')?.dataset.id, fGrip = a?.classList?.contains('grip'), fId = a?.id;
  el.innerHTML = html;
  const back = fCard && (fKey || fGrip) ? el.querySelector(`.mcard[data-id="${fCard}"] ${fKey ? `[data-key="${fKey}"]` : '.grip'}`) : fId ? $(fId) : null;
  back?.focus();
}
function updateStatusPills() {
  for (const m of cfg.methods) { const p = document.querySelector(`[data-st="${m.id}"]`); if (p) { p.className = `st ${m.state}`; p.textContent = stShort(m); p.title = m.msg + (m.install ? ' — ' + m.install : ''); } }
  const th = $('threads'); if (th) th.value = cfg.collection.threads; // server clamps 1–64
}

const sb = $('settings-body');
const cardId = (e) => e.target.closest('.mcard')?.dataset.id;
const methodPatch = (id, vals) => ({ methods: { [id]: vals } });
sb.addEventListener('change', (e) => {
  const t = e.target, id = cardId(e);
  if (t.dataset.act === 'toggle') return saveSettings(methodPatch(id, { enabled: t.checked }));
  if (t.dataset.key && id) {
    const isSecret = t.type === 'password';
    if (isSecret && !t.value) return;
    return saveSettings(methodPatch(id, { [t.dataset.key]: t.value }), isSecret);
  }
  if (t.id === 'threads') return saveSettings({ collection: { threads: t.value } }, false);
  if (t.id === 'export-dir') return saveSettings({ export: { dir: t.value.trim() } });
});
sb.addEventListener('click', (e) => {
  const t = e.target, id = cardId(e);
  if (t.closest('[data-act="expand"]')) { openCards.has(id) ? openCards.delete(id) : openCards.add(id); return renderSettings(); }
  const goto = t.closest('[data-goto-card]');
  if (goto) { openCards.add(goto.dataset.gotoCard); renderSettings(); const c = sb.querySelector(`.mcard[data-id="${goto.dataset.gotoCard}"]`); c?.scrollIntoView({ behavior: 'smooth', block: 'center' }); c?.classList.add('flash'); setTimeout(() => c?.classList.remove('flash'), 1200); return; }
  if (t.dataset.clear) return saveSettings(methodPatch(id, { [t.dataset.clear]: null }));
  if (t.dataset.rmroot) return saveSettings({ collection: { roots: cfg.collection.roots.filter(r => r !== t.dataset.rmroot) } });
  if (t.dataset.ext) return saveSettings({ export: { target: t.dataset.ext } });
  if (t.id === 'add-root') {
    if (!browsePath) return toast('Open links eerst een map in de bestandsbrowser', true);
    return saveSettings({ collection: { roots: [...cfg.collection.roots, browsePath] } });
  }
  if (t.id === 'export-here') {
    if (!browsePath) return toast('Open links eerst een map in de bestandsbrowser', true);
    return saveSettings({ export: { dir: browsePath, target: 'server' } });
  }
  if (t.id === 'index-start') return startIndex();
  if (t.id === 'index-stop') return fetch('/api/index/stop');
});

// drag & drop ordering (within one group), plus ↑/↓ on the focused grip
let dragEl = null;
let orderTimer;
const saveOrder = () => saveSettings({ order: [...sb.querySelectorAll('.mcard')].map(c => c.dataset.id) });
sb.addEventListener('mousedown', (e) => { const c = e.target.closest('.grip')?.closest('.mcard'); if (c) c.draggable = true; });
sb.addEventListener('dragstart', (e) => { dragEl = e.target.closest('.mcard'); dragEl?.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
sb.addEventListener('dragover', (e) => {
  if (!dragEl) return;
  const over = e.target.closest('.mcard'); e.preventDefault();
  if (!over || over === dragEl || over.parentNode !== dragEl.parentNode) return;
  const r = over.getBoundingClientRect();
  over.parentNode.insertBefore(dragEl, e.clientY < r.top + r.height / 2 ? over : over.nextSibling);
});
sb.addEventListener('drop', (e) => e.preventDefault());
sb.addEventListener('dragend', () => { if (!dragEl) return; dragEl.classList.remove('dragging'); dragEl.draggable = false; dragEl = null; saveOrder(); });
sb.addEventListener('keydown', (e) => {
  const g = e.target.closest('.grip'); if (!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const c = g.closest('.mcard'), sib = e.key === 'ArrowUp' ? c.previousElementSibling : c.nextElementSibling;
  if (!sib) return;
  c.parentNode.insertBefore(c, e.key === 'ArrowUp' ? sib : sib.nextSibling);
  g.focus(); // moving the node drops focus; keep it so repeated ↑/↓ keeps working
  clearTimeout(orderTimer); orderTimer = setTimeout(saveOrder, 500); // one save per burst of presses: a re-render from an older save would undo newer moves
});

// collection index (SSE)
let indexEs = null, indexLog = [];
function startIndex() {
  if (indexEs) return;
  indexLog = [];
  indexEs = new EventSource('/api/index');
  renderSettings();
  const logIt = (cls, txt) => {
    indexLog.push(`<div><span class="ts"></span><span class="${cls}">${cls === 'err' ? '!' : '·'}</span><span class="${cls}">${esc(txt)}</span></div>`);
    const d = $('index-details'); if (d) { d.hidden = false; d.open = true; }
    const l = $('index-log'); if (l) { l.insertAdjacentHTML('beforeend', indexLog[indexLog.length - 1]); l.scrollTop = l.scrollHeight; }
  };
  indexEs.addEventListener('progress', (e) => {
    const p = JSON.parse(e.data);
    if (p.error) return logIt('err', `${p.method}: ${p.error}${p.file ? ` (${p.file})` : ''}`);
    const bar = $('index-bar'); if (bar) bar.firstElementChild.style.width = (p.total ? Math.round(p.done / p.total * 100) : 100) + '%';
    if (p.done === 0) logIt('same', `${p.method}: ${plural(p.total, 'nieuw bestand', 'nieuwe bestanden')} te indexeren`);
    else logIt('ok', `${p.method}: ${p.done}/${p.total} · ${p.file}`);
  });
  const end = (msg, err) => { indexEs?.close(); indexEs = null; toast(msg, err); loadMethods().then(renderSettings); };
  indexEs.addEventListener('done', (e) => {
    const d = JSON.parse(e.data);
    for (const s of d.summary) if (!s.error) logIt('ok', `${s.method}: ${s.added} toegevoegd, ${s.total} in index${s.errors ? `, ${s.errors} fouten` : ''}`); // errors were already logged via progress
    if (d.summary.every(s => s.error)) { logIt('err', 'Geen indexeerbare methode actief: zet een "Eigen collectie"-methode aan die geïnstalleerd is.'); return end('Geen indexeerbare methode actief', true); }
    end(d.aborted ? 'Indexeren gestopt' : `Index bijgewerkt (${plural(d.files, 'bestand', 'bestanden')} in de collectie)`);
  });
  indexEs.addEventListener('error', (e) => {
    let msg = 'Indexeren mislukt (verbinding verbroken)';
    try { if (e.data) msg = JSON.parse(e.data).message; } catch {}
    logIt('err', msg); end(msg, true);
  });
}

// view toggle
function setView(v) {
  state.view = v; save();
  $('settings').hidden = v !== 'settings';
  document.querySelector('section.work').hidden = v === 'settings';
  $('view-btn').textContent = v === 'settings' ? '← Terug naar scannen' : 'Instellingen';
  if (v === 'settings') { renderSettings(); loadMethods(); }
}
$('view-btn').onclick = () => setView(state.view === 'settings' ? 'scan' : 'settings');

// ------------------------------------------------------------------ boot
function renderAll() { renderQueue(); renderResult(); }
setView(state.view || 'scan');
renderAll();
window.addEventListener('beforeunload', (e) => { if (running) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
