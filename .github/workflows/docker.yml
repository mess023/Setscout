# Build the Setscout images and push them to GitHub Container Registry:
#   ghcr.io/<owner>/setscout       — the app (+ ffmpeg, audfprint, Olaf, Panako, Dejavu, Essentia)
#   ghcr.io/<owner>/setscout-nafp  — optional neural-fingerprint worker (NeuralFP / PeakNetFP, TensorFlow CPU)
# Both Dockerfiles run a functional test during the build. The Android-emulator image (docker/android) is NOT
# built here: many GB and only useful with KVM.
name: docker

on:
  push:
    branches: [main, ui-test]   # ui-test: preview image ghcr.io/<owner>/setscout:ui-test, never "latest"
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: setscout
            context: .
          - name: setscout-nafp
            context: docker/nafp
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
